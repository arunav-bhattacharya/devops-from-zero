# Unit tests for the alerting rules (Day 44). Run:
#   docker compose exec prometheus promtool test rules /etc/prometheus/tests/alerts_test.yml
# promtool feeds in made-up series, runs the rules, and compares the alerts.
rule_files:
  - ../rules/recording.yml
  - ../rules/alerts.yml

evaluation_interval: 15s

tests:
  # The app stops answering at minute 3. HelloDown must wait 1 minute ("for: 1m").
  - interval: 1m
    input_series:
      - series: 'up{job="hello-devops", instance="web:8000"}'
        values: "1 1 1 0 0 0"
    alert_rule_test:
      - eval_time: 3m # just went down: pending, not firing yet
        alertname: HelloDown
        exp_alerts: []
      - eval_time: 5m # down for 2 minutes: firing
        alertname: HelloDown
        exp_alerts:
          - exp_labels:
              severity: page
              job: hello-devops
              instance: web:8000
            exp_annotations:
              summary: "hello-devops at web:8000 is down"
              description: "Prometheus has not been able to scrape web:8000 for 1 minute."

  # 5 good requests per second for 130 minutes. From minute 61, 1 failure per second.
  # The alert reads recording rules from another group, and groups run
  # independently, so it may see values from one evaluation earlier.
  # At minute 130 the whole 1-hour window is inside the errors, so the
  # ratio is the same either way: 60 failures / 360 requests a minute.
  - interval: 1m
    input_series:
      - series: 'hello_responses_total{job="hello-devops", instance="web:8000", path="/", status="200"}'
        values: "0+300x130"
      - series: 'hello_responses_total{job="hello-devops", instance="web:8000", path="/", status="500"}'
        values: "0x60 60+60x69"
    alert_rule_test:
      - eval_time: 60m # no errors yet
        alertname: HelloErrorBudgetFastBurn
        exp_alerts: []
      - eval_time: 130m # errors for over an hour: the fast burn alert fires
        alertname: HelloErrorBudgetFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              job: hello-devops
            exp_annotations:
              summary: "16.67% of hello-devops requests fail (fast burn)"
              description: "At this rate the 30-day error budget is gone in less than a week."

  # A slow leak: 5 good requests per second and 1 failure per minute (0.33%).
  # That is over the budget (0.1%) but far from a fast burn: a ticket, no page.
  - interval: 1m
    input_series:
      - series: 'hello_responses_total{job="hello-devops", instance="web:8000", path="/", status="200"}'
        values: "0+300x60"
      - series: 'hello_responses_total{job="hello-devops", instance="web:8000", path="/", status="500"}'
        values: "0+1x60"
    alert_rule_test:
      - eval_time: 60m
        alertname: HelloErrorBudgetFastBurn
        exp_alerts: []
      - eval_time: 60m
        alertname: HelloErrorBudgetSlowBurn
        exp_alerts:
          - exp_labels:
              severity: ticket
              job: hello-devops
            exp_annotations:
              summary: "0.3322% of hello-devops requests fail (slow burn)"
              description: "At this rate the 30-day error budget runs out before the month ends."
