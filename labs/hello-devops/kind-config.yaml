# kind create cluster --name devops --config kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # a NodePort inside the cluster...
        hostPort: 8081         # ...reachable on your laptop at localhost:8081
  - role: worker
  - role: worker
