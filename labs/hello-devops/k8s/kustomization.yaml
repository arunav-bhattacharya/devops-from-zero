# The list of files that make up the app. Apply them all with: kubectl apply -k k8s
# Argo CD (Day 20) reads this same file. k8s/gateway/ is NOT listed on purpose:
# it needs the Gateway API and a controller installed first (Day 19).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - redis.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
