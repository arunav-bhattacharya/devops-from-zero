# The list of files that make up the app. Apply them all with: kubectl apply -k k8s
# Days 40 to 43 add one file at a time. Argo CD (Day 47) reads this same file.
# Not listed on purpose:
#   k8s/gateway/  needs the Gateway API and a controller installed first (Day 44).
#   k8s/examples/ holds one-off experiments for Days 39, 41 and 42.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - redis.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
