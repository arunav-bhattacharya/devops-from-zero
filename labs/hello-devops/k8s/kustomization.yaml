# The list of files that make up the app. Apply them all with: kubectl apply -k k8s
# Days 32 to 35 add one file at a time. Argo CD (Day 39) reads this same file.
# Not listed on purpose:
#   k8s/gateway/  needs the Gateway API and a controller installed first (Day 36).
#   k8s/examples/ holds one-off experiments for Days 31, 33 and 34.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - redis.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
