# One stable name and address in front of all hello-devops pods.
apiVersion: v1
kind: Service
metadata:
  name: hello-devops
  namespace: hello
  labels:
    app: hello-devops
spec:
  type: NodePort
  selector:
    app: hello-devops # send traffic to every ready pod with this label
  ports:
    - name: http
      port: 80          # other pods call http://hello-devops (port 80)
      targetPort: 8000  # the port the app listens on inside its container
      nodePort: 30080   # open on every node; kind maps it to localhost:8081
