# A routing rule: requests for any path go to the hello-devops Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-devops
  namespace: hello
spec:
  parentRefs:
    - name: hello-gateway # attach to this Gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hello-devops # the Service from k8s/service.yaml
          port: 80
