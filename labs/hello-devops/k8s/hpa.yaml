# Adds or removes hello-devops pods to keep average CPU near 70% of the request.
# Needs metrics-server in the cluster (Day 18 shows how to install it on kind).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hello-devops
  namespace: hello
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hello-devops
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
