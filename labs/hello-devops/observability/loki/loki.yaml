# Loki for the laptop lab (Day 46): one process, logs kept on a local disk.
# compose.loki.yaml mounts this file at /etc/loki/loki.yaml.
# Check that Loki is up:  curl localhost:3100/ready

auth_enabled: false # one tenant and no login. Fine on a laptop, never on a server.

server:
  http_listen_port: 3100 # push and query API, and /ready

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki # the loki-data volume
  storage:
    filesystem: # chunks (the compressed log lines) and rules go to local folders
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1 # keep one copy: there is only one Loki
  ring:
    kvstore:
      store: inmemory

# How the index is stored. tsdb with schema v13 is what new installs use.
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h # one index file per day

# Delete logs older than 7 days. The compactor does the deleting.
limits_config:
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# Don't send anonymous usage statistics to Grafana Labs.
analytics:
  reporting_enabled: false
