# Default settings for the chart.
# Change them with -f my-values.yaml (preferred) or --set key=value.

replicaCount: 2 # ignored when autoscaling.enabled is true (the HPA owns the count then)

image:
  repository: hello-devops
  tag: "" # empty: use appVersion from Chart.yaml
  pullPolicy: IfNotPresent

# Settings the app reads from environment variables.
greeting: "Hello from Helm!"
redisHost: "" # empty: the app counts visits in memory

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 2

# Optional HorizontalPodAutoscaler. Needs metrics-server (Day 35).
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Optional Gateway API route. Needs a Gateway (k8s/gateway/ in the lab repo, Day 36).
httpRoute:
  enabled: false
  gateway:
    name: hello-gateway
    namespace: hello
  hostname: "" # for example helm.local; empty: match any host name
  path: /
