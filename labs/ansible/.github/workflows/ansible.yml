# .github/workflows/ansible.yml (Day 37): check the Ansible code on every
# pull request. It needs no servers and no secrets.
name: ansible

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Ansible and ansible-lint
        run: python -m pip install "ansible-core>=2.22,<2.23" "ansible-lint>=26.11,<27"

      - name: Install the collections from requirements.yml
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax check every playbook
        run: ansible-playbook --syntax-check ping.yml first-playbook.yml hello-devops.yml site.yml

      - name: Lint
        run: ansible-lint
