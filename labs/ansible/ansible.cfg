# ansible.cfg: settings for this folder. Ansible reads ./ansible.cfg when you
# run it from here. See every setting: ansible-config list
[defaults]
# Which inventory to use when you do not pass -i.
inventory = inventory.ini
# Log in as this user, with the lab's key (made by setup.sh).
remote_user = ubuntu
private_key_file = .keys/id_ed25519
# Roles live in ./roles (Day 37).
roles_path = roles
# Use the Python 3 that Ubuntu ships, and do not warn about finding it.
interpreter_python = auto_silent

[ssh_connection]
# Keep the lab's host keys in their own file, and trust a new server the
# first time only. A changed key after that is refused, as it should be.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=.keys/known_hosts -o StrictHostKeyChecking=accept-new
# Send modules over the open SSH connection instead of copying files first.
pipelining = True
