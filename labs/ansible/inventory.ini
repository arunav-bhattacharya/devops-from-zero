# inventory.ini: the servers Ansible manages, in groups.
# All three are containers on your Mac, so they share the address 127.0.0.1
# and differ by SSH port (see compose.yaml).

[web]
web1 ansible_host=127.0.0.1 ansible_port=2201
web2 ansible_host=127.0.0.1 ansible_port=2202

[lb]
lb1 ansible_host=127.0.0.1 ansible_port=2203

# A group of groups: every server in web and lb.
[lab:children]
web
lb
