# checkout: takes the payment. Its settings live in a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-settings
  namespace: debug-lab
data:
  GREETING: "Ready to pay?"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: debug-lab
  labels:
    app: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: web
          image: hello-devops:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: checkout-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
