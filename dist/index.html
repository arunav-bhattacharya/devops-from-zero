<title>DevOps from Zero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A hands-on DevOps course from zero: Linux, networking, Docker, GitHub Actions, Gradle, Terraform, Kubernetes, Argo CD, Prometheus, Grafana, ELK/EFK, OpenTelemetry, Dynatrace and DevSecOps.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Big+Shoulders+Stencil+Display:wght@700&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap">
<script>try{var t=localStorage.getItem("dfz-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>/* Layout: sticky top bar, part/lesson rail on the left (drawer on phones), one reading column,
   an "on this page" rail on wide screens. Visual world: a shipping yard and a CI run view —
   steel neutrals, container orange, signal teal, hazard yellow; condensed stencil display type. */
:root {
  --bg: #edf0f3;
  --panel: #ffffff;
  --panel-2: #e2e7ec;
  --ink: #132130;
  --mute: #485766;
  --faint: #6f7d8b;
  --rule: #cdd5dd;
  --orange: #c84410;
  --teal: #0a6a7e;
  --yellow: #e8ad00;
  --violet: #5b45b8;
  --green: #1b7f45;
  --red: #b8322a;
  --term-bg: #121d28;
  --term-fg: #d9e3ec;
  --term-mute: #8696a6;
  --hazard: #1d1d1d;
  --f-display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-stencil: "Big Shoulders Stencil Display", "Big Shoulders Display", "Arial Narrow", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --top: 58px;
  --side: 300px;
  --measure: 70ch;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c131a; --panel: #131d27; --panel-2: #1a2633; --ink: #e1e8ee; --mute: #a5b2be; --faint: #75838f;
    --rule: #253341; --orange: #ff7d3f; --teal: #4fbad1; --yellow: #f3c341; --violet: #a690f7; --green: #44c07a;
    --red: #f0675c; --term-bg: #080e14; --term-fg: #d9e3ec; --term-mute: #7f8fa0; --hazard: #0c131a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c131a; --panel: #131d27; --panel-2: #1a2633; --ink: #e1e8ee; --mute: #a5b2be; --faint: #75838f;
  --rule: #253341; --orange: #ff7d3f; --teal: #4fbad1; --yellow: #f3c341; --violet: #a690f7; --green: #44c07a;
  --red: #f0675c; --term-bg: #080e14; --term-fg: #d9e3ec; --term-mute: #7f8fa0; --hazard: #0c131a; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: calc(var(--top) + 16px); -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 18px/1.62 var(--f-body);
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
a { color: var(--teal); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { color: var(--orange); }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; border-radius: 3px; }
code { font-family: var(--f-mono); font-size: 0.86em; background: var(--panel-2); padding: 0.08em 0.36em; border-radius: 4px; overflow-wrap: anywhere; }
pre code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; }
strong { font-weight: 700; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.defs { position: absolute; }
.skip { position: absolute; left: -999px; top: 8px; }
.skip:focus { left: 12px; z-index: 99; background: var(--panel); padding: 6px 10px; }
.grow { flex: 1; }
.label { font: 700 12.5px/1.2 var(--f-body); letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); }
.mono { font-family: var(--f-mono); }
.tnum { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; height: var(--top);
  display: flex; align-items: center; gap: 12px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule);
}
.iconbtn { display: grid; place-items: center; width: 40px; height: 40px; border: 0; background: none; color: var(--ink); border-radius: var(--r); cursor: pointer; }
.iconbtn:hover { background: var(--panel-2); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; min-width: 0; }
.brand:hover { color: var(--ink); }
.brand-mark { display: grid; grid-template-columns: repeat(3, 7px); gap: 2px; align-items: end; }
.brand-mark i { display: block; width: 7px; background: var(--orange); border-radius: 1px; }
.brand-mark i:nth-child(1) { height: 10px; background: var(--teal); }
.brand-mark i:nth-child(2) { height: 16px; }
.brand-mark i:nth-child(3) { height: 22px; background: var(--yellow); }
.brand-name { font: 800 24px/1 var(--f-display); letter-spacing: 0.01em; white-space: nowrap; text-transform: uppercase; }
.brand-name em { font-style: normal; color: var(--orange); }
.brand-sep { color: var(--faint); }
.topnav { display: flex; gap: 2px; margin-left: 18px; }
.topnav a { color: var(--mute); text-decoration: none; font-size: 15.5px; padding: 7px 11px; border-radius: var(--r); display: flex; align-items: center; gap: 6px; }
.topnav a:hover { color: var(--ink); background: var(--panel-2); }
.topnav a.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--orange); border-radius: 0; }
.due { font: 700 11.5px/1 var(--f-mono); background: var(--orange); color: var(--panel); padding: 3px 6px; border-radius: 99px; }
@media (max-width: 899px) { .topnav { display: none; } }
@media (min-width: 1100px) { .menu { display: none; } }

/* ---------- shell ---------- */
.shell { display: block; }
.side {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + var(--top)); bottom: 0; left: 0; width: var(--side);
  overflow-y: auto; border-right: 1px solid var(--rule); background: var(--bg); z-index: 40;
  padding: 14px 0 40px; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-bottom: max(40px, env(safe-area-inset-bottom, 0px));
}
main { min-width: 0; padding-block: 28px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main:focus { outline: none; }
@media (min-width: 1100px) { main { margin-left: var(--side); padding-left: 40px; padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
@media (max-width: 1099px) {
  .side { transform: translateX(-102%); transition: transform 0.22s ease; width: min(88vw, 340px); top: 0; padding-top: max(14px, env(safe-area-inset-top, 0px)); z-index: 80; box-shadow: 0 0 40px rgb(0 0 0 / 0.25); }
  .side.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.45); z-index: 70; }
}
.page { max-width: 1060px; margin: 0 auto; display: grid; gap: 48px; }
.mobile-nav { display: none; }
@media (max-width: 899px) { .mobile-nav { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; } }

/* sidebar */
.side .navlink { display: flex; align-items: center; gap: 10px; padding: 7px 18px; color: var(--ink); text-decoration: none; font-size: 15.5px; border-left: 3px solid transparent; }
.side .navlink:hover { background: var(--panel-2); color: var(--ink); }
.side .navlink.on { border-left-color: var(--orange); font-weight: 700; background: var(--panel-2); }
.side .grp { border-top: 1px solid var(--rule); margin-top: 10px; padding-top: 6px; }
.side .grp-h { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 8px 18px 4px 10px; }
.side .grp-a { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 6px; align-items: baseline; text-decoration: none; color: var(--ink); min-width: 0; }
.side .grp-a:hover { color: var(--orange); }
.side .grp-tg { width: 22px; height: 22px; display: grid; place-items: center; border: 0; background: none; color: var(--faint); cursor: pointer; border-radius: 4px; padding: 0; }
.side .grp-tg:hover { background: var(--panel-2); color: var(--ink); }
.side .grp-tg[aria-expanded="true"] svg { transform: rotate(90deg); }
.side .grp-tg svg { transition: transform 0.15s; }
.side .grp-n { font: 700 13px var(--f-mono); color: var(--faint); }
.side .grp-t { font: 700 20px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: 0.02em; }
.side .grp-c { font: 600 12px var(--f-mono); color: var(--faint); }
.side .ls { display: grid; grid-template-columns: 18px 30px minmax(0, 1fr); gap: 6px; align-items: start; padding: 5px 18px 5px 21px; color: var(--mute); text-decoration: none; font-size: 15px; line-height: 1.35; border-left: 3px solid transparent; }
.side .ls:hover { color: var(--ink); background: var(--panel-2); }
.side .ls.on { color: var(--ink); border-left-color: var(--orange); background: var(--panel-2); font-weight: 700; }
.side .ls .d { font: 600 12.5px/1.6 var(--f-mono); color: var(--faint); }
.side .foot { padding: 18px; font-size: 13.5px; color: var(--faint); line-height: 1.45; }

/* status glyphs (CI run vocabulary: passed / in progress / queued) */
.st { width: 16px; height: 16px; display: inline-grid; place-items: center; flex: none; margin-top: 2px; }
.st svg { width: 16px; height: 16px; }
.st.passed { color: var(--green); }
.st.running { color: var(--orange); }
.st.queued { color: var(--faint); }
.st.running .spin { transform-origin: 8px 8px; animation: spin 1.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- buttons, fields ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; font: 700 16px/1 var(--f-body); padding: 12px 18px; border-radius: var(--r); border: 1.5px solid var(--orange); background: var(--orange); color: var(--panel); cursor: pointer; text-decoration: none; }
.btn:hover { filter: brightness(1.08); color: var(--panel); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn.ghost:hover { border-color: var(--ink); color: var(--ink); filter: none; }
.btn.sm { font-size: 14.5px; padding: 8px 12px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; filter: none; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--teal); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 13px/1 var(--f-body); padding: 7px 10px; border-radius: 99px; border: 1px solid var(--rule); color: var(--mute); background: var(--panel); text-decoration: none; cursor: pointer; }
.chip:hover { color: var(--ink); border-color: var(--ink); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
textarea.field, input.field { width: 100%; font: 17px/1.5 var(--f-body); color: var(--ink); background: var(--panel); border: 1.5px solid var(--rule); border-radius: var(--r); padding: 12px 14px; resize: vertical; }
textarea.field:focus, input.field:focus { outline: none; border-color: var(--teal); }

/* ---------- home ---------- */
.hero { display: grid; gap: 18px; }
.hero h1 { font: 800 clamp(54px, 10vw, 112px)/0.86 var(--f-display); text-transform: uppercase; letter-spacing: 0.005em; }
.hero h1 em { font-style: normal; color: var(--orange); display: block; }
.hero .sub { font-size: 20px; color: var(--mute); max-width: 56ch; margin: 0; }
.hero .meta { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.hero .meta span { font: 600 14px var(--f-mono); color: var(--faint); }

.term { background: var(--term-bg); color: var(--term-fg); border-radius: 10px; font: 15.5px/1.7 var(--f-mono); overflow: hidden; border: 1px solid color-mix(in srgb, var(--term-fg) 10%, transparent); }
.term-bar { display: flex; align-items: center; gap: 7px; padding: 10px 14px; border-bottom: 1px solid color-mix(in srgb, var(--term-fg) 10%, transparent); color: var(--term-mute); font-size: 13px; }
.term-bar i { width: 11px; height: 11px; border-radius: 50%; background: color-mix(in srgb, var(--term-fg) 22%, transparent); }
.term-bar span { margin-left: 8px; }
.term-body { padding: 16px 18px 18px; display: grid; gap: 4px; overflow-x: auto; }
.term-body .pr { color: var(--term-mute); }
.term-body .pr b { color: #ff9a62; font-weight: 600; }
.term-row { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 6px 0; }
.term-row .k { color: #ffb84d; }
.term-row .v { color: var(--term-fg); white-space: normal; }
.term-row .v a { color: #7fd6ea; }
.term-row .m { color: var(--term-mute); font-size: 13px; white-space: nowrap; }
.term-actions { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 12px; }
.term .btn.ghost { color: var(--term-fg); border-color: color-mix(in srgb, var(--term-fg) 28%, transparent); }
.term .btn.ghost:hover { border-color: var(--term-fg); }
@media (max-width: 560px) { .term-row { grid-template-columns: 62px minmax(0, 1fr); } .term-row .m { grid-column: 2; } }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 2px solid var(--ink); }
.stat { padding: 14px 16px 0 0; display: grid; gap: 4px; }
.stat + .stat { padding-left: 16px; border-left: 1px solid var(--rule); }
.stat .n { font: 800 46px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat .n small { font-size: 22px; color: var(--faint); }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stat:nth-child(3) { padding-left: 0; border-left: 0; } .stat { padding-bottom: 14px; } }

.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.sec-h h2 { font: 800 38px/1 var(--f-display); text-transform: uppercase; }

/* pipeline (the course drawn as a CI run) */
.pipe-wrap { overflow-x: auto; margin: 0 -4px; padding: 4px 4px 12px; }
.pipe { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 12px; align-items: start; }
.job { min-width: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.job-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--rule); text-decoration: none; color: var(--ink); }
.job-h:hover { background: var(--panel-2); color: var(--ink); }
.job-h .jt { font: 700 19px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: 0.02em; min-width: 0; }
.job-h .jc { margin-left: auto; font: 600 12px var(--f-mono); color: var(--faint); }
.job ol { list-style: none; margin: 0; padding: 6px 0; }
.job li a { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; padding: 5px 12px; color: var(--mute); text-decoration: none; font-size: 14px; line-height: 1.3; }
.job li a:hover { background: var(--panel-2); color: var(--ink); }
.job li a .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job li a.cur { color: var(--ink); font-weight: 700; }
.wire { width: 26px; flex: none; align-self: stretch; position: relative; }
.wire::before { content: ""; position: absolute; left: 0; right: 0; top: 22px; border-top: 2px solid var(--rule); }
.wire.ok::before { border-color: var(--green); }

.parts { display: grid; }
.prow { display: grid; grid-template-columns: 54px minmax(0, 1fr) 150px; gap: 16px; align-items: center; padding: 16px 4px; border-bottom: 1px solid var(--rule); color: var(--ink); text-decoration: none; }
.prow:hover { background: var(--panel); color: var(--ink); }
.prow .pn { font: 700 36px/1 var(--f-stencil); color: var(--faint); }
.prow .pt { font: 800 28px/1.05 var(--f-display); text-transform: uppercase; display: block; }
.prow .pd { color: var(--mute); font-size: 15.5px; display: block; margin-top: 3px; }
.bar { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 99px; }
.prow .pp { display: grid; gap: 6px; }
@media (max-width: 640px) { .prow { grid-template-columns: 40px minmax(0, 1fr); } .prow .pp { grid-column: 2; } .prow .pn { font-size: 28px; } }

.day-plan { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; counter-reset: s; }
.day-plan li { list-style: none; padding: 14px 14px 0 0; border-top: 3px solid var(--ink); display: grid; gap: 6px; align-content: start; }
.day-plan li + li { padding-left: 14px; }
.day-plan b { font: 800 24px/1 var(--f-display); text-transform: uppercase; }
.day-plan span { color: var(--mute); font-size: 15.5px; line-height: 1.45; }
.day-plan .mins { font: 600 13px var(--f-mono); color: var(--orange); }
@media (max-width: 760px) { .day-plan { grid-template-columns: minmax(0, 1fr); } .day-plan li + li { padding-left: 0; } .day-plan li { padding-bottom: 12px; } }

/* ---------- lesson ---------- */
.lesson { display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; max-width: 1180px; margin: 0 auto; }
@media (min-width: 1360px) { .lesson.toc-on { grid-template-columns: minmax(0, 1fr) 230px; } }
.lmain { min-width: 0; max-width: 780px; display: grid; gap: 44px; }
.lhead { display: grid; gap: 14px; }
.plate { display: flex; align-items: stretch; gap: 0; width: max-content; max-width: 100%; border: 2px solid var(--ink); border-radius: 4px; overflow: hidden; }
.plate .pd { font: 700 22px/1 var(--f-stencil); padding: 7px 10px 5px; background: var(--ink); color: var(--bg); letter-spacing: 0.03em; }
.plate .pp { font: 600 13px/1 var(--f-mono); padding: 8px 10px; display: flex; align-items: center; color: var(--mute); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lhead h1 { font: 800 clamp(44px, 7vw, 74px)/0.92 var(--f-display); text-transform: uppercase; }
.goal { font-size: 20.5px; color: var(--mute); margin: 0; max-width: 58ch; }
.lmeta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.timer { font: 600 14px var(--f-mono); color: var(--mute); }
.timer.live { color: var(--orange); }

.block { display: grid; gap: 14px; }
.block-h { display: flex; align-items: baseline; gap: 12px; }
.block-h h2 { font: 800 32px/1.05 var(--f-display); text-transform: uppercase; }
.block-h .num { font: 700 14px var(--f-mono); color: var(--orange); }
.prose { max-width: var(--measure); }
.prose p { margin: 0 0 14px; }
.prose p:last-child { margin-bottom: 0; }
.prose ul, .prose ol { margin: 0 0 14px; padding-left: 24px; display: grid; gap: 6px; }
.prose ul:last-child, .prose ol:last-child { margin-bottom: 0; }
.prose li::marker { color: var(--faint); }
.prose ol li::marker { font-family: var(--f-mono); font-size: 0.85em; color: var(--orange); }

.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 20px 22px; display: grid; gap: 12px; }
.warm { border-top: 4px solid var(--teal); }
.terms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; margin: 0; }
.terms div { border-top: 1px solid var(--rule); padding: 10px 0 12px; }
.terms dt { font-weight: 700; }
.terms dd { margin: 2px 0 0; color: var(--mute); font-size: 16.5px; line-height: 1.5; }
@media (max-width: 640px) { .terms { grid-template-columns: minmax(0, 1fr); } }

/* section */
.lsec { display: grid; gap: 14px; scroll-margin-top: calc(var(--top) + 16px); }
.lsec h2 { font: 800 30px/1.08 var(--f-display); text-transform: uppercase; display: flex; gap: 12px; align-items: baseline; }
.lsec h2 .n { font: 700 14px var(--f-mono); color: var(--orange); flex: none; transform: translateY(-4px); }

.callout { border-radius: 8px; padding: 16px 18px; display: grid; gap: 8px; background: var(--panel); border: 1px solid var(--rule); max-width: var(--measure); }
.callout .ch { display: flex; gap: 8px; align-items: center; font: 700 13px/1 var(--f-body); letter-spacing: 0.09em; text-transform: uppercase; }
.callout.analogy .ch { color: var(--violet); }
.callout.world .ch { color: var(--teal); }
.callout.mistake { border-left: 0; padding-left: 30px; position: relative; overflow: hidden; }
.callout.mistake::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: repeating-linear-gradient(-45deg, var(--yellow) 0 8px, var(--hazard) 8px 16px); }
.callout.mistake .ch { color: var(--ink); }

"740\" cy=\"225\" r=\"128\" fill=\"none\" opacity=\"0.3\"/><rect class=\"cv-fo\" x=\"700\" y=\"203\" width=\"80\" height=\"44\" rx=\"3\"/><path class=\"cv-sbg\" d=\"M708 211v28M716 211v28M724 211v28M732 211v28M740 211v28M748 211v28M756 211v28M764 211v28M772 211v28\" opacity=\"0.6\"/><\/svg>"}],"order":["d01","d02","d03","d04","d05","d06","d07","d08","d09","d10","d11","d12","d13","d14","d15","d16","d17","d18","d19","d20","d21","d22","d23","d24","d25","d26","d27","d28","d29","d30","d31","d32","d33","d34","d35","d36","d37","d38","d39","d40","d41","d42","d43","d44","d45","d46","d47","d48","d49","d50","d51","d52","d53","d54","d55"],"lessons":{"d01":{"id":"d01","k":0,"part":0,"day":1,"title":"The DevOps map","minutes":35,"pending":true,"scope":"Keep and deepen the first-edition Day 1. What DevOps is (culture, practices, tools; dev and ops sharing ownership). The path of one code change from laptop to users. Where every part of this course sits on that path: Linux and networking underneath, Docker packages, GitHub Actions automates, Gradle builds JVM apps, Terraform creates infrastructure, Kubernetes runs, Argo CD deploys from git, Prometheus/Grafana/EFK/OpenTelemetry/Dynatrace observe, DevSecOps protects. DORA metrics. Roles (DevOps engineer, SRE, platform engineer). How the course works. No installs."},"d02":{"id":"d02","k":1,"part":0,"day":2,"title":"Set up your laptop","minutes":35,"pending":true,"scope":"Keep the first-edition Day 2 (tested starter files, Homebrew, git, gh, VS Code, Docker Desktop with the default socket setting, kubectl, kind, helm, terraform via the HashiCorp tap) and add: jq, tree, watch, htop; a JDK 21 for the Gradle part (brew install openjdk@21 or SDKMAN, verify with java -version); an ubuntu container as a Linux practice box (docker run -it --rm ubuntu:24.04 bash) used in Part 1. Same hello-devops repo creation."},"d03":{"id":"d03","k":2,"part":1,"day":3,"title":"The shell and the file system","minutes":35,"pending":true,"scope":"Start from zero: terminal vs shell vs command; zsh on Mac vs bash on Linux; how to practise real Linux in the ubuntu container. Command anatomy (command, options, arguments; short vs long flags). Getting help: man (how to read a man page: synopsis, options, searching with /), --help, tldr. The prompt. The file system tree (/, /home, /etc, /var/log, /tmp, /usr/bin), absolute vs relative paths, ~, ., .., pwd, ls (-l, -a, -h, -t), cd and cd -, tab completion, history and Ctrl+R. Creating and moving things: mkdir -p, touch, cp -r, mv, rm and rm -r (and why rm has no undo), rmdir. Wildcards (globbing: *, ?, [abc]) and how the shell expands them before the command runs. Hidden files. tree. Practise inside labs/linux sample files."},"d04":{"id":"d04","k":3,"part":1,"day":4,"title":"Reading and searching text: cat, less, grep and find","minutes":35,"pending":true,"scope":"Viewing files: cat, less (navigation keys, /search, n, q), head and tail (-n), tail -f to follow a growing log. grep from zero, step by step with small examples on labs/linux/app.log: a literal search, -i, -n, -v, -c, -w, -l and -r across a folder, -A/-B/-C for context, -o. Then regular expressions as a tiny pattern language: literal characters, ., *, +, ?, ^ and $, [...] classes, \\d is not portable, -E for extended regex, alternation with |, quoting patterns so the shell does not touch them. Globs vs regex (different languages). find: -name, -iname, -type f/d, -size, -mtime, -maxdepth, -exec and -delete with care. A worked example: find every ERROR for one request ID across several log files. Mac (BSD) vs Linux (GNU) differences that matter here."},"d05":{"id":"d05","k":4,"part":1,"day":5,"title":"Pipes, redirection and text tools","minutes":35,"pending":true,"scope":"The three standard streams (stdin, stdout, stderr) and file descriptors 0, 1, 2. Redirection: >, >>, <, 2>, 2>&1, &> and /dev/null, with the classic mistake of > erasing a file. Pipes: building a pipeline one step at a time. The text tools: sort (-n, -r, -k, -t), uniq (and why it needs sorted input; -c), wc -l, cut (-d, -f), tr, head as a limiter, tee. awk for columns ('{print $1}', -F, a simple condition, summing a column). sed for substitution (s/old/new/g; -i differences on Mac vs Linux). xargs to turn lines into arguments. jq for JSON (., .field, .[], select, -r). Worked example: the top 5 client IPs and the top error paths from labs/linux/access.log. Command substitution $(...)."},"d06":{"id":"d06","k":5,"part":1,"day":6,"title":"Users, permissions, processes and services","minutes":35,"pending":true,"scope":"Users and groups, whoami, id, root and sudo (and why not to run everything with sudo). Reading ls -l column by column. Permissions rwx for user/group/others, on files vs directories, octal (755, 644, 600), chmod (symbolic and octal), chown, umask briefly, the execute bit and ./script.sh, why containers should not run as root. Processes: what a process and a PID are, ps aux, pgrep, top/htop, parent and child processes, foreground/background (&, jobs, fg, Ctrl+Z), nohup. Signals: SIGTERM vs SIGKILL vs SIGINT vs SIGHUP, kill and kill -9 and why docker stop and Kubernetes send SIGTERM first. Services with systemd: units, systemctl status/start/stop/restart/enable, journalctl -u -f --since. Resources: df -h, du -sh, free -h, uptime and load average, lsof and ss to see what listens on a port. Practise in the ubuntu container (note: systemd does not run in a plain container; show systemctl on a real VM or explain with output)."},"d07":{"id":"d07","k":6,"part":1,"day":7,"title":"Environment, packages, SSH and shell scripts","minutes":35,"pending":true,"scope":"Environment variables: env, printenv, echo $VAR, export, scope (a child process inherits, a parent does not), PATH and how a command is found (which, type), shell startup files (~/.zshrc, ~/.bashrc, ~/.profile). Package managers: apt (update, install, search), dnf, apk in Alpine images, brew on Mac. SSH: what it is, key pairs (ssh-keygen -t ed25519), ~/.ssh/authorized_keys, ~/.ssh/config hosts, ssh-agent, known_hosts, scp and rsync. Bash scripting from zero: shebang, chmod +x, variables and quoting (single vs double quotes, \"$var\"), arguments $1 $@ $#, exit codes and $?, if with [[ ]] and test, for and while loops, functions, reading a file line by line, set -euo pipefail and what each part prevents, trap for cleanup, shellcheck. Worked example: a health-check script that curls hello-devops and exits non-zero on failure, ready for CI."},"d08":{"id":"d08","k":7,"part":2,"day":8,"title":"How computers find each other: IP, ports and DNS","minutes":35,"pending":true,"scope":"IP addresses (IPv4, IPv6 in one paragraph), public vs private ranges, NAT and your home router, CIDR notation and subnet math with small examples (/24, /16, /32), the loopback address, what binding to 0.0.0.0 vs 127.0.0.1 means and why containers must bind 0.0.0.0. Ports and sockets, well-known ports, TCP vs UDP (handshake, reliability), what 'connection refused' vs 'timeout' tells you. DNS: names to addresses, the resolution chain (stub resolver, recursive resolver, root, TLD, authoritative), record types A, AAAA, CNAME, MX, TXT, NS, TTL and caching, /etc/hosts. Tools with real output: ping, dig (+short, +trace), nslookup, traceroute, ip addr / ifconfig, ss -tlnp / lsof -i, nc -zv. Worked example: debug why a service name does not resolve."},"d09":{"id":"d09","k":8,"part":2,"day":9,"title":"HTTP, TLS, proxies and load balancers","minutes":35,"pending":true,"scope":"HTTP from the wire up: request line, headers, body; methods and idempotency; status code families and the common ones (200, 201, 301/302, 304, 400, 401 vs 403, 404, 429, 500, 502, 503, 504) and what each tells an operator; headers that matter (Host, Content-Type, Authorization, Cache-Control, X-Forwarded-For); HTTP/1.1 vs HTTP/2 vs HTTP/3 in one paragraph. curl in depth (-v, -i, -I, -L, -X, -H, -d, -o, -w timing, --resolve). HTTPS and TLS: what it protects, the handshake in plain steps, certificates, certificate authorities and chains, expiry, Let's Encrypt and ACME, inspecting a certificate with openssl s_client and curl -v. Reverse proxies (nginx, Envoy) vs forward proxies, load balancers at layer 4 vs layer 7, health checks, sticky sessions, TLS termination, CDNs and caching, firewalls and rate limiting. Hands-on: nginx as a reverse proxy in front of two hello-devops containers with Docker."},"d10":{"id":"d10","k":9,"part":2,"day":10,"title":"The cloud: regions, core services, IAM and cost","minutes":35,"pending":true,"scope":"What the cloud is (renting computers, storage and services by the second). Regions and availability zones and why you spread across AZs. IaaS, PaaS, SaaS, serverless with examples. The core service map across AWS, Azure and Google Cloud (compute, containers, managed Kubernetes, object storage, databases, DNS, load balancers, IAM, monitoring). Networking in the cloud: VPC, subnets (public vs private), route tables, internet and NAT gateways, security groups (stateful) vs network ACLs (stateless). IAM: users, groups, roles, policies, the principle of least privilege, why roles beat long-lived keys. Shared responsibility. Pricing: on-demand vs reserved vs spot, data transfer costs, the free tiers in 2026 (from research), budgets and alerts, tagging, and the cleanup habit. No cloud account needed; the optional AWS steps come on Day 29."},"d11":{"id":"d11","k":10,"part":3,"day":11,"title":"Containers: your first docker run","minutes":35,"pending":true,"scope":"Keep and deepen first-edition Day 5: the works-on-my-machine problem, VM vs container (namespaces and cgroups explained with intuition), image vs container, Docker Engine, CLI and Desktop's Linux VM, docker run flags (-d, -p, --name, -e, --rm, -it), ps, logs, exec, stop, start, rm, the container lifecycle and states, port mapping, arm64 vs amd64."},"d12":{"id":"d12","k":11,"part":3,"day":12,"title":"Images, layers and registries","minutes":35,"pending":true,"scope":"What an image really is: a stack of read-only layers plus a config and a manifest; the union filesystem and the thin writable container layer (copy-on-write); content-addressed layers and why identical layers are shared; docker history, docker image inspect, and the dive tool. Registries: Docker Hub, GHCR, cloud registries; repository, tag, digest; why tags move and digests do not; pull by digest; multi-platform images and manifest lists (docker buildx imagetools inspect); official images and Docker Hardened Images (from research); docker login/tag/push basics; image size and why it matters."},"d13":{"id":"d13","k":12,"part":3,"day":13,"title":"Dockerfiles: package your own app","minutes":35,"pending":true,"scope":"Keep and deepen first-edition Day 6: every common instruction, build context and .dockerignore, the build cache and instruction order, CMD vs ENTRYPOINT (exec vs shell form and PID 1 signals), ARG vs ENV, tags and versions, docker init, twelve-factor config. Build and run hello-devops single-stage."},"d14":{"id":"d14","k":13,"part":3,"day":14,"title":"Volumes and networks","minutes":35,"pending":true,"scope":"Containers are disposable: where data lives. Volumes vs bind mounts vs tmpfs, named vs anonymous volumes, inspecting and backing up a volume, file ownership problems with bind mounts. Container networking: the default bridge vs user-defined bridge networks, built-in DNS by container name, host and none modes, publishing vs exposing ports, connecting a container to two networks, docker network inspect. Hands-on: Redis with a volume and hello-devops on a user-defined network without Compose."},"d15":{"id":"d15","k":14,"part":3,"day":15,"title":"Docker Compose","minutes":35,"pending":true,"scope":"Compose as a declarative description of a multi-container app. compose.yaml anatomy: services, build vs image, ports, environment and env_file, volumes, networks, depends_on with healthcheck conditions, restart policies, profiles. Commands: up -d, ps, logs -f, exec, run, down, down -v, config, watch for local development. Variable interpolation and .env. Override files for local vs CI. The lab's compose.yaml as the target, plus an nginx in front from Day 9."},"d16":{"id":"d16","k":15,"part":3,"day":16,"title":"Production-ready images","minutes":35,"pending":true,"scope":"Keep and deepen first-edition Day 8: multi-stage builds, base image trade-offs, non-root USER, HEALTHCHECK, pinning base images by digest, scanning (docker scout, trivy), secrets at build time (BuildKit --secret), multi-arch builds with buildx, pushing to GHCR, the lab's final Dockerfile (including --no-control-socket and the pip removal)."},"d17":{"id":"d17","k":16,"part":4,"day":17,"title":"Git, pull requests and CI/CD ideas","minutes":35,"pending":true,"scope":"Keep and deepen first-edition Day 9: git for teams (branches, commits, merge vs rebase in brief, pull requests, review, conflicts), trunk-based vs GitFlow, CI, continuous delivery vs deployment, pipeline stages, build once deploy many, deployment strategies, semantic versioning and tags."},"d18":{"id":"d18","k":17,"part":4,"day":18,"title":"GitHub Actions: your first workflow","minutes":35,"pending":true,"scope":"Keep and deepen first-edition Day 10: workflow anatomy, events and filters, jobs, steps, runners (GitHub-hosted including arm64, self-hosted), uses vs run, the Actions tab and logs, debug logging, env, billing and limits from research."},"d19":{"id":"d19","k":18,"part":4,"day":19,"title":"A real CI pipeline: test, lint, cache, matrix","minutes":35,"pending":true,"scope":"Keep and deepen first-edition Day 11: the lab's ci.yml step by step, setup-python caching and how cache keys work, matrix, needs, artifacts (v4+ behaviour), test reports, rulesets with required checks, concurrency, paths filters, timeouts, act for local runs."},"d20":{"id":"d20","k":19,"part":4,"day":20,"title":"Workflow logic: expressions, outputs and reusable workflows","minutes":35,"pending":true,"scope":"Contexts (github, env, vars, secrets, matrix, needs, steps, runner) and expressions; if conditions and status functions (success, failure, always, cancelled); step outputs via GITHUB_OUTPUT and job outputs; passing data between jobs; GITHUB_ENV and GITHUB_STEP_SUMMARY; workflow_dispatch inputs; reusable workflows (workflow_call, inputs, secrets: inherit, limits) vs composite actions; when to use each; environments as a concept preview."},"d21":{"id":"d21","k":20,"part":4,"day":21,"title":"Ship it: build and push images safely","minutes":35,"pending":true,"scope":"Keep and deepen first-edition Day 12: secrets and variables, GITHUB_TOKEN permissions and least privilege, the lab's release.yml (GHCR push on tags, multi-arch, digest in summary), environments with required reviewers, OIDC to the cloud, pinning actions to SHAs, Dependabot for actions, pull_request_target risks."},"d22":{"id":"d22","k":21,"part":5,"day":22,"title":"What a build tool does, and how Gradle thinks","minutes":35,"pending":true,"scope":"Why build tools exist (compile, test, package, dependencies, repeatability). Gradle's model: projects, tasks, plugins, the task graph with inputs and outputs, the three phases (initialization, configuration, execution), settings.gradle.kts vs build.gradle.kts, the Kotlin DSL, the Gradle Wrapper (gradlew, gradle-wrapper.properties, why you never use a global gradle), running tasks (build, test, run, clean, tasks, help --task), up-to-date checks, reading build output, Gradle vs Maven in brief. Hands-on with the new labs/hello-jvm Kotlin project."},"d23":{"id":"d23","k":22,"part":5,"day":23,"title":"Dependencies and multi-project builds","minutes":35,"pending":true,"scope":"Repositories (mavenCentral, gradlePluginPortal), coordinates (group:artifact:version), dependency configurations (implementation, api, compileOnly, runtimeOnly, testImplementation) and why implementation is the default, transitive dependencies, conflict resolution (highest version wins) and how to see it (dependencies, dependencyInsight), version catalogs (gradle/libs.versions.toml), platforms and BOMs, multi-project builds (settings include, project dependencies), convention plugins in build-logic (included build) to share configuration, publishing in one paragraph. Hands-on: split hello-jvm into app and lib modules with a catalog."},"d24":{"id":"d24","k":23,"part":5,"day":24,"title":"Fast builds, CI and containers for JVM apps","minutes":35,"pending":true,"scope":"Incremental builds and task inputs/outputs, the build cache (local and remote), the configuration cache, the daemon, parallel execution, Java toolchains, Build Scans and Develocity, dependency verification and locking. Gradle in GitHub Actions with gradle/actions/setup-gradle (caching, wrapper validation, build scan publishing). Containerizing a JVM app: a multi-stage Dockerfile that builds with Gradle and runs on a JRE image, layer order for dependency caching, Jib as a Dockerfile-free alternative, JVM memory flags in containers (MaxRAMPercentage). Writes the lab's hello-jvm Dockerfile and .github/workflows/jvm-ci.yml."},"d25":{"id":"d25","k":24,"part":6,"day":25,"title":"Infrastructure as Code and your first Terraform","minutes":35,"pending":true,"scope":"Keep and deepen first-edition Day 13: why IaC, declarative vs imperative, Terraform vs OpenTofu and other tools, providers and resources, init/plan/apply/destroy, reading a plan, the nginx example with the docker provider, the lock file."},"d26":{"id":"d26","k":25,"part":6,"day":26,"title":"The Terraform language: variables, types and loops","minutes":35,"pending":true,"scope":"HCL in depth: blocks, arguments, expressions, references; types (string, number, bool, list, set, map, object, tuple); input variables with types, defaults, validation and sensitive; tfvars files and precedence; locals; outputs; string templates and heredocs; conditionals; for expressions; count vs for_each and the index-shifting trap; dynamic blocks; built-in functions; terraform console to experiment. Hands-on: run three nginx containers from a map with for_each using the docker provider."},"d27":{"id":"d27","k":26,"part":6,"day":27,"title":"State: Terraform's memory","minutes":35,"pending":true,"scope":"What state holds and why; terraform state list/show/mv/rm; moved blocks for refactoring; import blocks; drift and plan -refresh-only (and what apply -refresh-only really does); sensitive values in state; remote backends and locking (S3 with use_lockfile; HCP Terraform status from research); ephemeral values and write-only arguments if current; never commit state. Hands-on: the lab's infra/local, then rename a resource with a moved block and import a container created by hand."},"d28":{"id":"d28","k":27,"part":6,"day":28,"title":"Modules and environments","minutes":35,"pending":true,"scope":"Modules: root vs child, inputs and outputs, local modules vs registry modules, version pinning, composition and small focused modules; environments: workspaces vs separate directories vs tfvars per environment, and which teams prefer; terraform test basics; formatting, validation and tflint. Hands-on: turn infra/local into a reusable module used twice (dev and test stacks on different ports)."},"d29":{"id":"d29","k":28,"part":6,"day":29,"title":"Terraform on a real cloud, and in CI","minutes":35,"pending":true,"scope":"Keep and deepen first-edition Day 15: AWS account safety, provider auth, the lab's infra/aws (private versioned S3 bucket, OIDC role), S3 backend, destroy, costs, terraform.yml (plan on PR, apply on main behind an environment), scanners (tflint, trivy config, checkov)."},"d30":{"id":"d30","k":29,"part":7,"day":30,"title":"Why Kubernetes, and how a cluster works","minutes":35,"pending":true,"scope":"Keep and deepen first-edition Day 16: the problems at scale, desired state and control loops, the control plane (API server, etcd, scheduler, controller manager) and nodes (kubelet, kube-proxy, containerd), what happens step by step when you run kubectl apply, managed Kubernetes, when not to use Kubernetes, creating the kind cluster from the lab's kind-config.yaml."},"d31":{"id":"d31","k":30,"part":7,"day":31,"title":"Pods, kubectl and YAML","minutes":35,"pending":true,"scope":"Manifest anatomy (apiVersion, kind, metadata, spec, status), kubectl explain, -o yaml and --dry-run=client to generate YAML. Pods: phases and container states, restart policies, multi-container pods, init containers and sidecars (GA), why you rarely create bare Pods. Labels vs annotations, selectors, namespaces, kubeconfig and contexts. kubectl essentials: get (-o wide, -w, -l, -A), describe, logs (-f, -c, --previous), exec -it, port-forward, apply vs create, delete. kind load docker-image."},"d32":{"id":"d32","k":31,"part":7,"day":32,"title":"Deployments and rollouts","minutes":35,"pending":true,"scope":"Keep and deepen the Deployment half of first-edition Day 17: ReplicaSets, Deployments, self-healing, scaling, rolling updates with maxSurge/maxUnavailable, rollout status/history/undo, set image vs editing YAML, revision history, recreate strategy, how readiness gates a rollout (preview of Day 35)."},"d33":{"id":"d33","k":32,"part":7,"day":33,"title":"Services and cluster networking","minutes":35,"pending":true,"scope":"Keep and deepen the Service half of first-edition Day 17 and add networking: the pod network (every Pod gets an IP, CNI plugins), Services as stable names and IPs, ClusterIP, NodePort, LoadBalancer, headless, EndpointSlices, kube-proxy, CoreDNS and service DNS names, port vs targetPort vs nodePort, NetworkPolicies (default allow, a simple deny-all plus allow), and the lab's NodePort 30080 mapping to localhost:8081."},"d34":{"id":"d34","k":33,"part":7,"day":34,"title":"ConfigMaps and Secrets","minutes":35,"pending":true,"scope":"Keep and deepen the config half of first-edition Day 18: ConfigMaps as env, envFrom and mounted files, what happens on change (env needs a restart, files update), Secrets and why base64 is not encryption, types of Secrets, encryption at rest, external secret managers (External Secrets Operator, Sealed Secrets, SOPS) in brief, immutable ConfigMaps, rolling a Deployment after config changes."},"d35":{"id":"d35","k":34,"part":7,"day":35,"title":"Health checks, resources and scaling","minutes":35,"pending":true,"scope":"Keep and deepen the health and scaling half of first-edition Day 18 and add scheduling: liveness, readiness and startup probes with the app's /healthz and /readyz, requests vs limits, QoS classes, OOMKilled and CPU throttling, LimitRanges and ResourceQuotas briefly, HPA with metrics-server on kind, VPA and in-place resize in brief, scheduling basics (nodeSelector, affinity, taints and tolerations), PodDisruptionBudgets."},"d36":{"id":"d36","k":35,"part":7,"day":36,"title":"Traffic and storage: Gateway API, Ingress and volumes","minutes":35,"pending":true,"scope":"Keep and deepen the traffic and storage half of first-edition Day 19: Ingress vs Gateway API (ingress-nginx retirement), Envoy Gateway on kind with the lab's k8s/gateway files, HTTPRoute matching and traffic splitting, TLS at the gateway; storage: volumes, PersistentVolumes, PersistentVolumeClaims, StorageClasses and dynamic provisioning, access modes, StatefulSets for databases and why managed databases are often better."},"d37":{"id":"d37","k":36,"part":7,"day":37,"title":"Packaging with Helm and Kustomize","minutes":35,"pending":true,"scope":"Keep and deepen the Helm half of first-edition Day 19: why package manifests, Helm charts, values, templates and helpers, releases and revisions, install/upgrade/rollback/uninstall/template/lint, OCI registries for charts, Helm 4 changes from research, the lab's chart/hello-devops; Kustomize bases and overlays for dev and prod, patches and images transformers, Helm vs Kustomize and using both."},"d38":{"id":"d38","k":37,"part":7,"day":38,"title":"Troubleshooting Kubernetes","minutes":35,"pending":true,"scope":"A systematic debugging flow (is it the Pod, the Service, the network, the config, or the node?). Common failure states and their usual causes: Pending, ContainerCreating, ImagePullBackOff/ErrImagePull, CrashLoopBackOff, OOMKilled, CreateContainerConfigError, Running but not Ready, Service with no endpoints. Tools: kubectl describe and events (--sort-by), logs --previous, exec, port-forward, kubectl debug with ephemeral containers, a netshoot or busybox pod for DNS and network checks, kubectl top, k9s. RBAC basics (Role, RoleBinding, ServiceAccount, kubectl auth can-i) because 'forbidden' errors are common. Hands-on: a break-and-fix lab with five deliberately broken manifests in labs/hello-devops/k8s-broken/."},"d39":{"id":"d39","k":38,"part":8,"day":39,"title":"GitOps with Argo CD","minutes":35,"pending":true,"scope":"Keep and deepen first-edition Day 20: OpenGitOps principles, push vs pull deploys, Argo CD architecture, install on kind, the UI and CLI, the lab's argocd/application.yaml, sync, automated sync, self-heal, prune, health status, drift demo, rollback with git revert."},"d40":{"id":"d40","k":39,"part":8,"day":40,"title":"GitOps in practice: environments, promotion and image updates","minutes":35,"pending":true,"scope":"Repo structure (app repo vs config repo, monorepo), environments with Kustomize overlays, promotion between environments by pull request, how CI updates the image tag in git (kustomize edit set image in a workflow, or Argo CD Image Updater), ApplicationSets and app-of-apps, sync waves and hooks, secrets in GitOps (Sealed Secrets, External Secrets, SOPS), Argo CD RBAC and projects in brief, Flux compared with Argo CD."},"d41":{"id":"d41","k":40,"part":9,"day":41,"title":"Observability foundations: signals, SLOs and alerts","minutes":35,"pending":true,"scope":"Monitoring vs observability, the signals (metrics, logs, traces, profiles) and what each is good for, golden signals, RED and USE methods, SLIs, SLOs and error budgets with a worked calculation, alerting on symptoms not dding a histogram for latency). Long-term storage and scale in brief (remote write, Thanos, Mimir)."},"d45":{"id":"d45","k":44,"part":10,"day":45,"title":"Grafana dashboards","minutes":35,"pending":true,"scope":"What Grafana is (a front end for many data sources). Data sources, panels and visualizations (time series, stat, gauge, bar, table, heatmap), the query editor with PromQL, units and thresholds, transformations, variables and templating (a $service dropdown), annotations, rows and layout, dashboard design for operators (RED dashboard at the top, details below), dashboard JSON and provisioning as code (datasources and dashboards folders). Hands-on: provision a hello-devops RED dashboard into the lab's Compose stack."},"d46":{"id":"d46","k":45,"part":10,"day":46,"title":"Grafana beyond dashboards: alerting, Loki and the LGTM stack","minutes":35,"pending":true,"scope":"Grafana alerting (alert rules, contact points, notification policies) and when to use it vs Alertmanager; Loki and LogQL basics (labels vs content, line filters, parsers, metrics from logs); Tempo for traces and trace-to-logs links; Pyroscope in one paragraph; Grafana Alloy as the collector; the LGTM stack; Grafana Cloud free tier from research; dashboards as code (Terraform provider, the newer as-code tooling); what changed in Grafana 12 and 13. Hands-on: add Loki to the Compose stack and query hello-devops logs."},"d47":{"id":"d47","k":46,"part":11,"day":47,"title":"Centralized logging and the Elastic stack","minutes":35,"pending":true,"scope":"Why centralize logs, structured JSON logs and log levels, what not to log (secrets, personal data). The Elastic stack: Elasticsearch concepts (documents, indices, mappings, the inverted index, shards, replicas, nodes and clusters), ingest options (Logstash, Beats, Elastic Agent, Fluent Bit or Fluentd) and the ELK vs EFK naming, Kibana Discover, KQL and ES|QL basics, OpenSearch as the fork and the licence history. Hands-on: the lab's logging/compose.yaml with Elasticsearch, Kibana and Fluent Bit collecting hello-devops container logs; search them in Kibana."},"d48":{"id":"d48","k":47,"part":11,"day":48,"title":"Running EFK on Kubernetes","minutes":35,"pending":true,"scope":"Fluent Bit as a DaemonSet reading /var/log/containers, the Kubernetes filter for pod metadata, parsers and multiline logs, outputs to Elasticsearch; index templates, data streams and index lifecycle management for retention; Kibana dashboards and alerting; the cost of logs (volume, retention, sampling); Loki vs Elasticsearch trade-offs and when to choose each. Hands-on: install Fluent Bit with Helm on kind using the lab's logging/fluent-bit-values.yaml, pointing at a single-node Elasticsearch."},"d49":{"id":"d49","k":48,"part":11,"day":49,"title":"Distributed tracing with OpenTelemetry","minutes":35,"pending":true,"scope":"Why traces (one request across many services), spans, trace IDs, parent/child, attributes and events, context propagation with W3C traceparent, sampling (head vs tail), OpenTelemetry (API, SDK, auto-instrumentation, the Collector with receivers, processors and exporters, OTLP), Jaeger and Tempo as backends, linking traces to logs and metrics. Hands-on: run hello-devops with opentelemetry-instrument (no code changes) and the lab's tracing/compose.yaml with an OpenTelemetry Collector and Jaeger; find the slow span."},"d50":{"id":"d50","k":49,"part":12,"day":50,"title":"Dynatrace: one platform for every signal","minutes":35,"pending":true,"scope":"What problem an all-in-one commercial platform solves and what it costs you (money, lock-in). OneAgent and automatic instrumentation, ActiveGate, entities and the Smartscape topology, PurePath distributed traces, services/processes/hosts views, Davis AI and problems with root cause, dashboards and Notebooks, the current platform naming from research. Dynatrace vs the open-source stack from Parts 9 to 11 and vs other vendors (Datadog, New Relic, Elastic). How to get a free trial."},"d51":{"id":"d51","k":50,"part":12,"day":51,"title":"Dynatrace in practice: Kubernetes, Grail and DQL","minutes":35,"pending":true,"scope":"The Dynatrace Operator and DynaKube (deployment modes from research) with the lab's dynatrace/dynakube.yaml for a kind cluster, what you see after install, Grail and DQL from zero (fetch, filter, fields, summarize, sort, timeseries, makeTimeseries) with examples on logs, spans and metrics, SLOs in Dynatrace, workflows and automation, OpenTelemetry ingest into Dynatrace, release validation in CI/CD, cost awareness and the trial's limits, Dynatrace University and certification."},"d52":{"id":"d52","k":51,"part":13,"day":52,"title":"The software supply chain","minutes":35,"pending":true,"scope":"Keep and deepen first-edition Day 22: shift left, real incidents with sources, SBOMs, vulnerability scanning, signing with cosign keyless, SLSA and provenance, GitHub artifact attestations, the lab's hardened release.yml."},"d53":{"id":"d53","k":52,"part":13,"day":53,"title":"Secrets, access and policy as code","minutes":35,"pending":true,"scope":"Secrets management (Vault/OpenBao, cloud secret managers, External Secrets Operator, Sealed Secrets, SOPS) and where each fits; secret scanning (gitleaks, GitHub push protection); Kubernetes RBAC and service accounts with least privilege; Pod Security Standards; policy as code with Kyverno (the lab's policy/ files) and OPA Gatekeeper; admission control explained; a security checklist for hello-devops."},"d54":{"id":"d54","k":53,"part":14,"day":54,"title":"Platform engineering, FinOps and AI in DevOps","minutes":35,"pending":true,"scope":"Keep and deepen the first half of first-edition Day 23: platform engineering and internal developer platforms, golden paths, Backstage, the CNCF maturity model, developer experience, FinOps, AI in DevOps with guardrails (the lab's policy/ai-agent-readonly.yaml), other trends (eBPF, OpenTofu, WebAssembly, serverless containers)."},"d55":{"id":"d55","k":54,"part":14,"day": n class=\"c1\"># Replace &lt;your-github-user&gt; with your GitHub user name first.<\/span>\n<span class=\"nt\">apiVersion<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">argoproj.io/v1alpha1<\/span>\n<span class=\"nt\">kind<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">Application<\/span>\n<span class=\"nt\">metadata<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">name<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">hello-devops<\/span>\n<span class=\"w\">  <\/span><span class=\"c1\"># Applications live in the namespace where Argo CD runs.<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">namespace<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">argocd<\/span>\n<span class=\"w\">  <\/span><span class=\"c1\"># When you delete this Application, also delete the things it created.<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">finalizers<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">resources-finalizer.argocd.argoproj.io<\/span>\n<span class=\"nt\">spec<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">project<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">default<\/span>\n<span class=\"w\">  <\/span><span class=\"c1\"># Where the desired state lives: your repo, branch main, folder k8s.<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">source<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">repoURL<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">https://github.com/&lt;your-github-user&gt;/hello-devops<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">targetRevision<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">main<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">path<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">k8s<\/span>\n<span class=\"w\">  <\/span><span class=\"c1\"># Where to deploy: the same cluster Argo CD runs in, namespace hello.<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">destination<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">server<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">https://kubernetes.default.svc<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">namespace<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">hello<\/span>\n<span class=\"w\">  <\/span><span class=\"c1\"># The autoscaler (k8s/hpa.yaml) changes the number of replicas while the app runs.<\/span>\n<span class=\"w\">  <\/span><span class=\"c1\"># Ignore that one field, so Argo CD and the autoscaler do not fight.<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">ignoreDifferences<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">group<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">apps<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">kind<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">Deployment<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">name<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">hello-devops<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">jsonPointers<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">        <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">/spec/replicas<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">syncPolicy<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">automated<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">prune<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">true<\/span><span class=\"w\"> <\/span><span class=\"c1\"># delete things that you removed from git<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">selfHeal<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">true<\/span><span class=\"w\"> <\/span><span class=\"c1\"># undo changes made by hand in the cluster<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">syncOptions<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">      <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">CreateNamespace=true<\/span><span class=\"w\"> <\/span><span class=\"c1\"># create namespace hello if it is missing<\/span>\n<span class=\"w\">      <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">RespectIgnoreDifferences=true<\/span><span class=\"w\"> <\/span><span class=\"c1\"># also skip /spec/replicas when syncing<\/span>\n","lines":39},{"path":"observability/servicemonitor.yaml","lang":"yaml","day":21,"html":"<span class=\"c1\"># Tells Prometheus to scrape hello-devops every 15 seconds.<\/span>\n<span class=\"c1\"># Needs kube-prometheus-stack (see values.yaml). It finds the Service in<\/span>\n<span class=\"c1\"># k8s/service.yaml by its label app: hello-devops and its port named http.<\/span>\n<span class=\"c1\"># Apply: kubectl apply -f observability/servicemonitor.yaml<\/span>\n<span class=\"nt\">apiVersion<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">monitoring.coreos.com/v1<\/span>\n<span class=\"nt\">kind<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">ServiceMonitor<\/span>\n<span class=\"nt\">metadata<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">name<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">hello-devops<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">namespace<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">hello<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">labels<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"c1\"># Prometheus from the \"monitoring\" Helm release only reads<\/span>\n<span class=\"w\">    <\/span><span class=\"c1\"># ServiceMonitors with this label.<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">release<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">monitoring<\/span>\n<span class=\"nt\">spec<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"c1\"># Find Services with this label ...<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">selector<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">matchLabels<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">app<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">hello-devops<\/span>\n<span class=\"w\">  <\/span><span class=\"c1\"># ... in this namespace.<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">namespaceSelector<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">matchNames<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">      <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">hello<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">endpoints<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">port<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">http<\/span><span class=\"w\"> <\/span><span class=\"c1\"># the name of the Service port (port 80, which leads to 8000)<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">path<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">/metrics<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">interval<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">15s<\/span>\n","lines":27},{"path":"observability/values.yaml","lang":"yaml","day":21,"html":"<span class=\"c1\"># Settings for the kube-prometheus-stack Helm chart on a laptop kind cluster.<\/span>\n<span class=\"c1\"># It installs Prometheus, Grafana, Alertmanager and the Prometheus Operator.<\/span>\n<span class=\"c1\">#<\/span>\n<span class=\"c1\"># Install (check the chart's README for the current command):<\/span>\n<span class=\"c1\">#   helm install monitoring oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack \\<\/span>\n<span class=\"c1\">#     --namespace monitoring --create-namespace -f observability/values.yaml<\/span>\n<span class=\"c1\">#<\/span>\n<span class=\"c1\"># The release name \"monitoring\" matters. By default, this Prometheus only reads<\/span>\n<span class=\"c1\"># ServiceMonitors that carry the label release: monitoring.<\/span>\n\n<span class=\"c1\"># On kind, these control plane parts listen only on 127.0.0.1 inside their node,<\/span>\n<span class=\"c1\"># so Prometheus cannot reach them. Skip them to avoid false \"down\" targets.<\/span>\n<span class=\"nt\">kubeControllerManager<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">enabled<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">false<\/span>\n<span class=\"nt\">kubeScheduler<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">enabled<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">false<\/span>\n<span class=\"nt\">kubeEtcd<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">enabled<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">false<\/span>\n<span class=\"nt\">kubeProxy<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">enabled<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">false<\/span>\n\n<span class=\"nt\">prometheus<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">prometheusSpec<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"c1\"># Keep one day of data. This is a lab, not production.<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">retention<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">1d<\/span>\n\n<span class=\"nt\">grafana<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"c1\"># Show times in your browser's time zone.<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">defaultDashboardsTimezone<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">browser<\/span>\n","lines":30},{"path":"Dockerfile","lang":"dockerfile","day":22,"html":"<span class=\"c\"># syntax=docker/dockerfile:1<\/span>\n\n<span class=\ <script>(() => {
"use strict";
const C = JSON.parse(document.getElementById("course").textContent);
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5);
const fmt = (s, o = { weekday: "short", month: "short", day: "numeric" }) => new Date(s + "T12:00:00").toLocaleDateString("en-US", o);
const nowIso = () => new Date().toISOString();
const L = (id) => C.lessons[id];
const ready = (id) => L(id) && !L(id).pending;
const partOf = (n) => C.parts.find((p) => p.part === n);
const main = $("#main");

/* ---------------- storage ---------------- */
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage blocked */ } },
};
const KEY = "dfz-progress-v1";
function norm(r) {
  r = r || {};
  return { log: { ...(r.log || {}) }, scores: { ...(r.scores || {}) }, quiz: { ...(r.quiz || {}) }, tasks: { ...(r.tasks || {}) },
    cards: { ...(r.cards || {}) }, days: { ...(r.days || {}) }, start: r.start || null, startU: r.startU || "" };
}
function merge(a, raw) {
  const b = norm(raw), o = norm(a);
  for (const f of ["log", "tasks", "cards"]) for (const [k, e] of Object.entries(b[f])) if (!o[f][k] || (e.u || "") > (o[f][k].u || "")) o[f][k] = e;
  for (const f of ["scores", "quiz", "days"]) for (const [k, v] of Object.entries(b[f])) o[f][k] = Math.max(o[f][k] || 0, v);
  if (b.startU > o.startU) { o.start = b.start; o.startU = b.startU; }
  return o;
}
const sig = (x) => JSON.stringify(norm(x));
let P = norm(ls.get(KEY, {}));
let ref = null, sync = "local", writing = false, again = false, wTimer = null;
async function write() {
  if (!ref) return;
  if (writing) { again = true; return; }
  writing = true;
  try { await ref.set({ ...P, updatedAt: nowIso() }); sync = "cloud"; } catch { sync = "local"; }
  writing = false; sideFoot();
  if (again) { again = false; write(); }
}
function commit() { ls.set(KEY, P); if (ref) { clearTimeout(wTimer); wTimer = setTimeout(write, 600); } chrome(); }
function activity() { const t = today(); P.days[t] = (P.days[t] || 0) + 1; }

const cap = (name) => { try { return window.claude && window.claude.use ? Promise.resolve(window.claude.use(name)).catch(() => null) : Promise.resolve(null); } catch { return Promise.resolve(null); } };
let sample = null;
(async () => {
  const [db, user] = await Promise.all([cap("db"), cap("user")]);
  if (!db || !user) return;
  let uid = null;
  try { uid = await user.id(); } catch { uid = null; }
  if (!uid) return;
  try { ref = db.collection("data/users/" + uid).doc("progress"); } catch { ref = null; return; }
  ref.onSnapshot((snap) => {
    sync = "cloud";
    const d = snap.exists ? snap.data() : null;
    if (!d) { write(); return; }
    const m = merge(P, d), changed = sig(m) !== sig(P);
    P = m; ls.set(KEY, P);
    if (sig(m) !== sig(d)) { clearTimeout(wTimer); wTimer = setTimeout(write, 600); }
    if (changed) { chrome(); if (["home", "plan", "review-idle"].includes(viewKind())) render(false); }
    sideFoot();
  }, () => { sync = "local"; sideFoot(); });
})();
cap("sample").then((s) => { sample = s || null; if (sample) mountAi(); });

/* ---------------- progress ---------------- */
const isDone = (id) => !!(P.log[id] && P.log[id].done);
const doneCount = () => C.order.filter(isDone).length;
const nextUp = () => C.order.find((id) => !isDone(id) && ready(id)) || C.order.find((id) => !isDone(id)) || null;
function setDone(id, done) {
  const prev = P.log[id];
  P.log[id] = { done, at: done ? (prev && prev.done ? prev.at : nowIso()) : (prev ? prev.at : nowIso()), u: nowIso() };
  if (done) { activity(); if (!P.start) { P.start = today(); P.startU = nowIso(); } }
  commit();
  if (done) {
    const n = cardsFor(id).length;
    toast(`Day ${pad(L(id).day)} passed.${n ? ` ${n} cards added to your review deck.` : ""}`);
  }
}
function streak() {
  let d = today(), n = 0;
  if (!P.days[d]) d = addDays(d, -1);
  while (P.days[d]) { n++; d = addDays(d, -1); }
  return n;
}
function startDate() { return P.start || today(); }
function projection() {
  const t = today();
  const remaining = C.order.filter((id) => !isDone(id));
  const doneToday = C.order.some((id) => isDone(id) && P.log[id].at && ymd(new Date(P.log[id].at)) === t);
  const from = doneToday ? addDays(t, 1) : t;
  const finish = remaining.length ? addDays(from, remaining.length - 1) : t;
  const planned = addDays(startDate(), C.order.length - 1);
  return { finish, planned, slip: daysBetween(planned, finish), remaining: remaining.length };
}

/* ---------------- spaced repetition ---------------- */
const IV = [0, 1, 3, 7, 14, 30, 60];
const NEW_PER_SESSION = 20;
function allCards() {
  const out = [];
  for (const id of C.order) if (ready(id)) for (const t of L(id).terms) out.push({ id: t.id, front: esc(t.term), back: t.plain, src: id, unlocked: isDone(id) });
  for (const p of C.parts) if (p.ready) { const all = p.lessons.every(isDone); for (const f of p.flashcards) out.push({ id: f.id, front: f.front, back: f.back, src: "p" + p.part, unlocked: all }); }
  return out;
}
const cardsFor = (lid) => allCards().filter((c) => (c.src === lid || (c.src === "p" + L(lid).part && partOf(L(lid).part).lessons.every(isDone))) && !P.cards[c.id]);
function dueCards() {
  const t = today(), cards = allCards().filter((c) => c.unlocked);
  const due = cards.filter((c) => P.cards[c.id] && P.cards[c.id].due <= t).sort((a, b) => P.cards[a.id].due.localeCompare(P.cards[b.id].due));
  const fresh = cards.filter((c) => !P.cards[c.id]);
  return { due, fresh, total: cards.length };
}
const dueCount = () => { const d = dueCards(); return d.due.length + Math.min(d.fresh.length, NEW_PER_SESSION); };
function rateCard(id, r) {
  const cur = P.cards[id] || { box: 0, n: 0 };
  let box = cur.box, gap;
  if (r === 0) { box = 1; gap = 0; }
  else if (r === 1) { box = Math.max(1, box); gap = Math.max(1, Math.round(IV[box] / 2)); }
  else if (r === 2) { box = Math.min(6, box + 1); gap = IV[box]; }
  else { box = Math.min(6, box + 2); gap = IV[box]; }
  P.cards[id] = { box, due: addDays(today(), gap), n: (cur.n || 0) + 1, u: nowIso() };
  activity(); commit();
}
function preview(id) {
  const box = (P.cards[id] || { box: 0 }).box;
  const lab = (n) => (n === 0 ? "now" : n === 1 ? "1 day" : `${n} days`);
  return [lab(0), lab(Math.max(1, Math.round(IV[Math.max(1, box)] / 2))), lab(IV[Math.min(6, box + 1)]), lab(IV[Math.min(6, box + 2)])];
}

/* ---------------- small UI parts ---------------- */
const GLYPH = {
  passed: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.2" fill="currentColor"/><path d="M4.8 8.2l2.1 2.1 4.3-4.6" fill="none" stroke="var(--panel)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  running: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="2"/><path class="spin" d="M8 1.6a6.4 6.4 0 0 1 6.4 6.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="8" cy="8" r="2.4" fill="currentColor"/></svg>',
  queued: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.6 2.4"/></svg>',
};
const stateOf = (id) => (isDone(id) ? "passed" : id === nextUp() ? "running" : "queued");
const stLabel = { passed: "passed", running: "up next", queued: "queued" };
const glyph = (id) => { const s = stateOf(id); return `<span class="st ${s}" title="${stLabel[s]}" aria-label="${stLabel[s]}">${GLYPH[s]}</span>`; };
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };
const toastEl = $("#toast");
let toastT = null;
function toast(t) { toastEl.textContent = t; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (toastEl.hidden = true), 3200); }
const ICON = {
  arrow: '<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  check: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  bulb: '<svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path d="M10 2.5a5.5 5.5 0 0 0-3.2 10V15h6.4v-2.5A5.5 5.5 0 0 0 10 2.5zM7.8 17.5h4.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  team: '<svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><circle cx="7" cy="7" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="14" cy="8" r="2.1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 16.5c.6-2.8 2.4-4.2 4.5-4.2s3.9 1.4 4.5 4.2M12 12.6c2.3-.4 4.5.8 5.3 3.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  chev: '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  play: '<svg viewBox="0 0 12 12" width="9" height="9" aria-hidden="true"><path d="M3 2l7 4-7 4z" fill="currentColor"/></svg>',
  warn: '<svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path d="M10 2.8l7.8 13.7H2.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 8v3.8M10 14.2v.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
};

/* ---------------- chrome: sidebar, badges, theme ---------------- */
const side = $("#side"), scrim = $("#scrim"), menuBtn = $("#menuBtn");
const sideOpen = {};
function route() { return (location.hash || "").slice(1) || "home"; }
function viewKind() { const r = route(); if (r === "review") return review.active ? "review-live" : "review-idle"; return /^d\d\d$/.test(r) ? "lesson" : r; }
function sideHTML() {
  const r = route(), nx = nextUp(), dc = dueCount();
  const link = (h, t, extra = "") => `<a class="navlink${r === h ? " on" : ""}" href="#${h}">${t}${extra}</a>`;
  let s = `<div>${link("home", "Today")}${nx ? `<a class="navlink" href="#${nx}">Up next: Day ${pad(L(nx).day)}</a>` : ""}${link("review", "Review", dc ? ` <span class="due">${dc}</span>` : "")}${link("plan", "Plan and pace")}${link("commands", "Command cheat sheet")}${link("glossary", "Glossary")}${link("library", "Library: links and videos")}${link("labs", "Lab files")}</div>`;
  const curPart = L(r) ? L(r).part : /^p\d+$/.test(r) ? +r.slice(1) : nx ? L(nx).part : 0;
  for (const p of C.parts) {
    const n = p.lessons.filter(isDone).length, open = sideOpen[p.part] ?? p.part === curPart;
    s += `<div class="grp"><div class="grp-h"><button class="grp-tg" data-act="sidetog" data-p="${p.part}" aria-expanded="${open}" aria-label="${open ? "Collapse" : "Expand"} part ${p.part}">${ICON.chev}</button><a class="grp-a" href="#p${p.part}"><span class="grp-n">${p.part}</span><span class="grp-t">${esc(p.title)}</span></a><span class="grp-c tnum">${n}/${p.lessons.length}</span></div>`;
    if (open) for (const id of p.lessons) s += `<a class="ls${r === id ? " on" : ""}" href="#${id}">${glyph(id)}<span class="d">${pad(L(id).day)}</span><span>${esc(L(id).title)}</span></a>`;
    s += "</div>";
  }
