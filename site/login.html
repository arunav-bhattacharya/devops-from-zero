<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in · DevOps from Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Big+Shoulders+Stencil+Display:wght@700&family=Atkinson+Hyperlegible+Next:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@400&display=swap">
<script>try{var t=localStorage.getItem("dfz-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>/*CSS*/
.login { min-height: 100vh; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.login-card { width: min(100%, 620px); display: grid; gap: 20px; }
.login h1 { font: 800 clamp(48px, 9vw, 76px)/0.88 var(--f-display); text-transform: uppercase; margin: 0; }
.login h1 em { font-style: normal; color: var(--orange); display: block; }
.login p { margin: 0; color: var(--mute); font-size: 18px; }
#g { min-height: 44px; }
.msg { min-height: 1.5em; font-size: 15px; color: var(--mute); }
.msg.bad { color: var(--red); }
.free { font-size: 16px; }
</style></head>
<body><div class="login" role="main"><div class="login-card">
<figure class="part-art" style="margin:0">{{PLATE}}</figure>
<h1>DevOps,<em>from zero</em></h1>
<p>Sign in with your Gmail account to open all 55 lessons and save your progress across devices. Only enrolled Gmail addresses can sign in.</p>
<div id="g"></div>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
<a class="free" href="/">Or keep reading the free chapters: Start here, Linux and Networking</a>
</div></div>
<script>
var msg = document.getElementById("msg");
function say(t, bad) { msg.textContent = t; msg.className = "msg" + (bad ? " bad" : ""); }
function next() { var n = new URLSearchParams(location.search).get("next") || "/"; return n.charAt(0) === "/" && n.charAt(1) !== "/" ? n : "/"; }
async function done(r) {
  say("Checking your account...");
  var x = await fetch("/api/session", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ credential: r.credential }) });
  var d = {}; try { d = await x.json(); } catch (e) {}
  if (x.ok) return location.replace(next());
  if (x.status === 403) say((d.email || "This Gmail address") + " is not enrolled. Ask the course owner to add it.", true);
  else say("Google sign-in failed (" + (d.detail || "unknown reason") + "). Please try again.", true);
}
async function start() {
  var cfg = {};
  try { cfg = await (await fetch("/api/config")).json(); } catch (e) {}
  if (!window.google || !cfg.clientId) { say("Could not load Google sign-in. Check your connection and reload.", true); return; }
  var dark = document.documentElement.getAttribute("data-theme") === "dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  google.accounts.id.initialize({ client_id: cfg.clientId, callback: done, itp_support: true });
  google.accounts.id.renderButton(document.getElementById("g"), { theme: dark ? "filled_black" : "outline", size: "large", shape: "rectangular", text: "signin_with", width: 280 });
  say("If Google shows an error such as origin_mismatch, add " + location.origin + " to the Google client's authorized JavaScript origins.");
}
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="start()" onerror="start()"></script>
</body></html>
