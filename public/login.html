<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in · DevOps from Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Big+Shoulders+Stencil+Display:wght@700&family=Atkinson+Hyperlegible+Next:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@400&display=swap">
<script>try{var t=localStorage.getItem("dfz-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>/* Layout: sticky top bar, part/lesson rail on the left (drawer on phones), one reading column,
   an "on this page" rail on wide screens. Visual world: a shipping yard and a CI run view —
   steel neutrals, container orange, signal teal, hazard yellow; condensed stencil display type. */
:root {
  --bg: #edf0f3;
  --panel: #ffffff;
  --panel-2: #e2e7ec;
  --ink: #132130;
  --mute: #485766;
  --faint: #6f7d8b;
  --rule: #cdd5dd;
  --orange: #c84410;
  --teal: #0a6a7e;
  --yellow: #e8ad00;
  --violet: #5b45b8;
  --green: #1b7f45;
  --red: #b8322a;
  --term-bg: #121d28;
  --term-fg: #d9e3ec;
  --term-mute: #8696a6;
  --hazard: #1d1d1d;
  --f-display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-stencil: "Big Shoulders Stencil Display", "Big Shoulders Display", "Arial Narrow", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --top: 58px;
  --side: 300px;
  --measure: 70ch;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c131a; --panel: #131d27; --panel-2: #1a2633; --ink: #e1e8ee; --mute: #a5b2be; --faint: #75838f;
    --rule: #253341; --orange: #ff7d3f; --teal: #4fbad1; --yellow: #f3c341; --violet: #a690f7; --green: #44c07a;
    --red: #f0675c; --term-bg: #080e14; --term-fg: #d9e3ec; --term-mute: #7f8fa0; --hazard: #0c131a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c131a; --panel: #131d27; --panel-2: #1a2633; --ink: #e1e8ee; --mute: #a5b2be; --faint: #75838f;
  --rule: #253341; --orange: #ff7d3f; --teal: #4fbad1; --yellow: #f3c341; --violet: #a690f7; --green: #44c07a;
  --red: #f0675c; --term-bg: #080e14; --term-fg: #d9e3ec; --term-mute: #7f8fa0; --hazard: #0c131a; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: calc(var(--top) + 16px); -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 18px/1.62 var(--f-body);
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
a { color: var(--teal); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { color: var(--orange); }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; border-radius: 3px; }
code { font-family: var(--f-mono); font-size: 0.86em; background: var(--panel-2); padding: 0.08em 0.36em; border-radius: 4px; overflow-wrap: anywhere; }
pre code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; }
strong { font-weight: 700; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.defs { position: absolute; }
.skip { position: absolute; left: -999px; top: 8px; }
.skip:focus { left: 12px; z-index: 99; background: var(--panel); padding: 6px 10px; }
.grow { flex: 1; }
.label { font: 700 12.5px/1.2 var(--f-body); letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); }
.mono { font-family: var(--f-mono); }
.tnum { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; height: var(--top);
  display: flex; align-items: center; gap: 12px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule);
}
.iconbtn { display: grid; place-items: center; width: 40px; height: 40px; border: 0; background: none; color: var(--ink); border-radius: var(--r); cursor: pointer; }
.iconbtn:hover { background: var(--panel-2); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; min-width: 0; }
.brand:hover { color: var(--ink); }
.brand-mark { display: grid; grid-template-columns: repeat(3, 7px); gap: 2px; align-items: end; }
.brand-mark i { display: block; width: 7px; background: var(--orange); border-radius: 1px; }
.brand-mark i:nth-child(1) { height: 10px; background: var(--teal); }
.brand-mark i:nth-child(2) { height: 16px; }
.brand-mark i:nth-child(3) { height: 22px; background: var(--yellow); }
.brand-name { font: 800 24px/1 var(--f-display); letter-spacing: 0.01em; white-space: nowrap; text-transform: uppercase; }
.brand-name em { font-style: normal; color: var(--orange); }
.brand-sep { color: var(--faint); }
.topnav { display: flex; gap: 2px; margin-left: 18px; }
.topnav a { color: var(--mute); text-decoration: none; font-size: 15.5px; padding: 7px 11px; border-radius: var(--r); display: flex; align-items: center; gap: 6px; }
.topnav a:hover { color: var(--ink); background: var(--panel-2); }
.topnav a.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--orange); border-radius: 0; }
.due { font: 700 11.5px/1 var(--f-mono); background: var(--orange); color: var(--panel); padding: 3px 6px; border-radius: 99px; }
@media (max-width: 899px) { .topnav { display: none; } }
@media (min-width: 1100px) { .menu { display: none; } }

/* ---------- shell ---------- */
.shell { display: block; }
.side {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + var(--top)); bottom: 0; left: 0; width: var(--side);
  overflow-y: auto; border-right: 1px solid var(--rule); background: var(--bg); z-index: 40;
  padding: 14px 0 40px; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-bottom: max(40px, env(safe-area-inset-bottom, 0px));
}
main { min-width: 0; padding-block: 28px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main:focus { outline: none; }
@media (min-width: 1100px) { main { margin-left: var(--side); padding-left: 40px; padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
@media (max-width: 1099px) {
  .side { transform: translateX(-102%); transition: transform 0.22s ease; width: min(88vw, 340px); top: 0; padding-top: max(14px, env(safe-area-inset-top, 0px)); z-index: 80; box-shadow: 0 0 40px rgb(0 0 0 / 0.25); }
  .side.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.45); z-index: 70; }
}
.page { max-width: 1060px; margin: 0 auto; display: grid; gap: 48px; }
.mobile-nav { display: none; }
@media (max-width: 899px) { .mobile-nav { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; } }

/* sidebar */
.side .navlink { display: flex; align-items: center; gap: 10px; padding: 7px 18px; color: var(--ink); text-decoration: none; font-size: 15.5px; border-left: 3px solid transparent; }
.side .navlink:hover { background: var(--panel-2); color: var(--ink); }
.side .navlink.on { border-left-color: var(--orange); font-weight: 700; background: var(--panel-2); }
.side .grp { border-top: 1px solid var(--rule); margin-top: 10px; padding-top: 6px; }
.side .grp-h { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 8px 18px 4px 10px; }
.side .grp-a { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 6px; align-items: baseline; text-decoration: none; color: var(--ink); min-width: 0; }
.side .grp-a:hover { color: var(--orange); }
.side .grp-tg { width: 22px; height: 22px; display: grid; place-items: center; border: 0; background: none; color: var(--faint); cursor: pointer; border-radius: 4px; padding: 0; }
.side .grp-tg:hover { background: var(--panel-2); color: var(--ink); }
.side .grp-tg[aria-expanded="true"] svg { transform: rotate(90deg); }
.side .grp-tg svg { transition: transform 0.15s; }
.side .grp-n { font: 700 13px var(--f-mono); color: var(--faint); }
.side .grp-t { font: 700 20px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: 0.02em; }
.side .grp-c { font: 600 12px var(--f-mono); color: var(--faint); }
.side .ls { display: grid; grid-template-columns: 18px 30px minmax(0, 1fr); gap: 6px; align-items: start; padding: 5px 18px 5px 21px; color: var(--mute); text-decoration: none; font-size: 15px; line-height: 1.35; border-left: 3px solid transparent; }
.side .ls:hover { color: var(--ink); background: var(--panel-2); }
.side .ls.on { color: var(--ink); border-left-color: var(--orange); background: var(--panel-2); font-weight: 700; }
.side .ls .d { font: 600 12.5px/1.6 var(--f-mono); color: var(--faint); }
.side .foot { padding: 18px; font-size: 13.5px; color: var(--faint); line-height: 1.45; }

/* status glyphs (CI run vocabulary: passed / in progress / queued) */
.st { width: 16px; height: 16px; display: inline-grid; place-items: center; flex: none; margin-top: 2px; }
.st svg { width: 16px; height: 16px; }
.st.passed { color: var(--green); }
.st.running { color: var(--orange); }
.st.queued { color: var(--faint); }
.st.running .spin { transform-origin: 8px 8px; animation: spin 1.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- buttons, fields ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; font: 700 16px/1 var(--f-body); padding: 12px 18px; border-radius: var(--r); border: 1.5px solid var(--orange); background: var(--orange); color: var(--panel); cursor: pointer; text-decoration: none; }
.btn:hover { filter: brightness(1.08); color: var(--panel); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn.ghost:hover { border-color: var(--ink); color: var(--ink); filter: none; }
.btn.sm { font-size: 14.5px; padding: 8px 12px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; filter: none; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--teal); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 13px/1 var(--f-body); padding: 7px 10px; border-radius: 99px; border: 1px solid var(--rule); color: var(--mute); background: var(--panel); text-decoration: none; cursor: pointer; }
.chip:hover { color: var(--ink); border-color: var(--ink); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
textarea.field, input.field { width: 100%; font: 17px/1.5 var(--f-body); color: var(--ink); background: var(--panel); border: 1.5px solid var(--rule); border-radius: var(--r); padding: 12px 14px; resize: vertical; }
textarea.field:focus, input.field:focus { outline: none; border-color: var(--teal); }

/* ---------- home ---------- */
.hero { display: grid; gap: 18px; }
.hero h1 { font: 800 clamp(54px, 10vw, 112px)/0.86 var(--f-display); text-transform: uppercase; letter-spacing: 0.005em; }
.hero h1 em { font-style: normal; color: var(--orange); display: block; }
.hero .sub { font-size: 20px; color: var(--mute); max-width: 56ch; margin: 0; }
.hero .meta { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.hero .meta span { font: 600 14px var(--f-mono); color: var(--faint); }

.term { background: var(--term-bg); color: var(--term-fg); border-radius: 10px; font: 15.5px/1.7 var(--f-mono); overflow: hidden; border: 1px solid color-mix(in srgb, var(--term-fg) 10%, transparent); }
.term-bar { display: flex; align-items: center; gap: 7px; padding: 10px 14px; border-bottom: 1px solid color-mix(in srgb, var(--term-fg) 10%, transparent); color: var(--term-mute); font-size: 13px; }
.term-bar i { width: 11px; height: 11px; border-radius: 50%; background: color-mix(in srgb, var(--term-fg) 22%, transparent); }
.term-bar span { margin-left: 8px; }
.term-body { padding: 16px 18px 18px; display: grid; gap: 4px; overflow-x: auto; }
.term-body .pr { color: var(--term-mute); }
.term-body .pr b { color: #ff9a62; font-weight: 600; }
.term-row { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 6px 0; }
.term-row .k { color: #ffb84d; }
.term-row .v { color: var(--term-fg); white-space: normal; }
.term-row .v a { color: #7fd6ea; }
.term-row .m { color: var(--term-mute); font-size: 13px; white-space: nowrap; }
.term-actions { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 12px; }
.term .btn.ghost { color: var(--term-fg); border-color: color-mix(in srgb, var(--term-fg) 28%, transparent); }
.term .btn.ghost:hover { border-color: var(--term-fg); }
@media (max-width: 560px) { .term-row { grid-template-columns: 62px minmax(0, 1fr); } .term-row .m { grid-column: 2; } }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 2px solid var(--ink); }
.stat { padding: 14px 16px 0 0; display: grid; gap: 4px; }
.stat + .stat { padding-left: 16px; border-left: 1px solid var(--rule); }
.stat .n { font: 800 46px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat .n small { font-size: 22px; color: var(--faint); }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stat:nth-child(3) { padding-left: 0; border-left: 0; } .stat { padding-bottom: 14px; } }

.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
.sec-h h2 { font: 800 38px/1 var(--f-display); text-transform: uppercase; }

/* pipeline (the course drawn as a CI run) */
.pipe-wrap { overflow-x: auto; margin: 0 -4px; padding: 4px 4px 12px; }
.pipe { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 12px; align-items: start; }
.job { min-width: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.job-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--rule); text-decoration: none; color: var(--ink); }
.job-h:hover { background: var(--panel-2); color: var(--ink); }
.job-h .jt { font: 700 19px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: 0.02em; min-width: 0; }
.job-h .jc { margin-left: auto; font: 600 12px var(--f-mono); color: var(--faint); }
.job ol { list-style: none; margin: 0; padding: 6px 0; }
.job li a { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; padding: 5px 12px; color: var(--mute); text-decoration: none; font-size: 14px; line-height: 1.3; }
.job li a:hover { background: var(--panel-2); color: var(--ink); }
.job li a .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job li a.cur { color: var(--ink); font-weight: 700; }
.wire { width: 26px; flex: none; align-self: stretch; position: relative; }
.wire::before { content: ""; position: absolute; left: 0; right: 0; top: 22px; border-top: 2px solid var(--rule); }
.wire.ok::before { border-color: var(--green); }

.parts { display: grid; }
.prow { display: grid; grid-template-columns: 54px minmax(0, 1fr) 150px; gap: 16px; align-items: center; padding: 16px 4px; border-bottom: 1px solid var(--rule); color: var(--ink); text-decoration: none; }
.prow:hover { background: var(--panel); color: var(--ink); }
.prow .pn { font: 700 36px/1 var(--f-stencil); color: var(--faint); }
.prow .pt { font: 800 28px/1.05 var(--f-display); text-transform: uppercase; display: block; }
.prow .pd { color: var(--mute); font-size: 15.5px; display: block; margin-top: 3px; }
.bar { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 99px; }
.prow .pp { display: grid; gap: 6px; }
@media (max-width: 640px) { .prow { grid-template-columns: 40px minmax(0, 1fr); } .prow .pp { grid-column: 2; } .prow .pn { font-size: 28px; } }

.day-plan { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; counter-reset: s; }
.day-plan li { list-style: none; padding: 14px 14px 0 0; border-top: 3px solid var(--ink); display: grid; gap: 6px; align-content: start; }
.day-plan li + li { padding-left: 14px; }
.day-plan b { font: 800 24px/1 var(--f-display); text-transform: uppercase; }
.day-plan span { color: var(--mute); font-size: 15.5px; line-height: 1.45; }
.day-plan .mins { font: 600 13px var(--f-mono); color: var(--orange); }
@media (max-width: 760px) { .day-plan { grid-template-columns: minmax(0, 1fr); } .day-plan li + li { padding-left: 0; } .day-plan li { padding-bottom: 12px; } }

/* ---------- lesson ---------- */
.lesson { display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; max-width: 1180px; margin: 0 auto; }
@media (min-width: 1360px) { .lesson.toc-on { grid-template-columns: minmax(0, 1fr) 230px; } }
.lmain { min-width: 0; max-width: 780px; display: grid; gap: 44px; }
.lhead { display: grid; gap: 14px; }
.plate { display: flex; align-items: stretch; gap: 0; width: max-content; max-width: 100%; border: 2px solid var(--ink); border-radius: 4px; overflow: hidden; }
.plate .pd { font: 700 22px/1 var(--f-stencil); padding: 7px 10px 5px; background: var(--ink); color: var(--bg); letter-spacing: 0.03em; }
.plate .pp { font: 600 13px/1 var(--f-mono); padding: 8px 10px; display: flex; align-items: center; color: var(--mute); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lhead h1 { font: 800 clamp(44px, 7vw, 74px)/0.92 var(--f-display); text-transform: uppercase; }
.goal { font-size: 20.5px; color: var(--mute); margin: 0; max-width: 58ch; }
.lmeta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.timer { font: 600 14px var(--f-mono); color: var(--mute); }
.timer.live { color: var(--orange); }

.block { display: grid; gap: 14px; }
.block-h { display: flex; align-items: baseline; gap: 12px; }
.block-h h2 { font: 800 32px/1.05 var(--f-display); text-transform: uppercase; }
.block-h .num { font: 700 14px var(--f-mono); color: var(--orange); }
.prose { max-width: var(--measure); }
.prose p { margin: 0 0 14px; }
.prose p:last-child { margin-bottom: 0; }
.prose ul, .prose ol { margin: 0 0 14px; padding-left: 24px; display: grid; gap: 6px; }
.prose ul:last-child, .prose ol:last-child { margin-bottom: 0; }
.prose li::marker { color: var(--faint); }
.prose ol li::marker { font-family: var(--f-mono); font-size: 0.85em; color: var(--orange); }

.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 20px 22px; display: grid; gap: 12px; }
.warm { border-top: 4px solid var(--teal); }
.terms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; margin: 0; }
.terms div { border-top: 1px solid var(--rule); padding: 10px 0 12px; }
.terms dt { font-weight: 700; }
.terms dd { margin: 2px 0 0; color: var(--mute); font-size: 16.5px; line-height: 1.5; }
@media (max-width: 640px) { .terms { grid-template-columns: minmax(0, 1fr); } }

/* section */
.lsec { display: grid; gap: 14px; scroll-margin-top: calc(var(--top) + 16px); }
.lsec h2 { font: 800 30px/1.08 var(--f-display); text-transform: uppercase; display: flex; gap: 12px; align-items: baseline; }
.lsec h2 .n { font: 700 14px var(--f-mono); color: var(--orange); flex: none; transform: translateY(-4px); }

.callout { border-radius: 8px; padding: 16px 18px; display: grid; gap: 8px; background: var(--panel); border: 1px solid var(--rule); max-width: var(--measure); }
.callout .ch { display: flex; gap: 8px; align-items: center; font: 700 13px/1 var(--f-body); letter-spacing: 0.09em; text-transform: uppercase; }
.callout.analogy .ch { color: var(--violet); }
.callout.world .ch { color: var(--teal); }
.callout.mistake { border-left: 0; padding-left: 30px; position: relative; overflow: hidden; }
.callout.mistake::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: repeating-linear-gradient(-45deg, var(--yellow) 0 8px, var(--hazard) 8px 16px); }
.callout.mistake .ch { color: var(--ink); }

.refs { display: grid; gap: 6px; padding: 12px 0 0; border-top: 1px dashed var(--rule); max-width: var(--measure); }

<p>Sign in with your Gmail account to open all 55 lessons and save your progress across devices. Only enrolled Gmail addresses can sign in.</p>
<div id="g"></div>
<div class="msg" id="msg" role="status" aria-live="polite"></div>

</div></div>
<script>
var msg = document.getElementById("msg");
function say(t, bad) { msg.textContent = t; msg.className = "msg" + (bad ? " bad" : ""); }
function next() { var n = new URLSearchParams(location.search).get("next") || "/"; return n.charAt(0) === "/" && n.charAt(1) !== "/" ? n : "/"; }
async function done(r) {
  say("Checking your account...");
  var x = await fetch("/api/session", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ credential: r.credential }) });
  var d = {}; try { d = await x.json(); } catch (e) {}
  if (x.ok) return location.replace(next());
  if (x.status === 403) say((d.email || "This Gmail address") + " is not enrolled. Ask the course owner to add it.", true);
  else say("Google sign-in failed (" + (d.detail || "unknown reason") + "). Please try again.", true);
}
async function start() {
  var cfg = {};
  try { cfg = await (await fetch("/api/config")).json(); } catch (e) {}
  if (!window.google || !cfg.clientId) { say("Could not load Google sign-in. Check your connection and reload.", true); return; }
  var dark = document.documentElement.getAttribute("data-theme") === "dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  google.accounts.id.initialize({ client_id: cfg.clientId, callback: done, itp_support: true });
  google.accounts.id.renderButton(document.getElementById("g"), { theme: dark ? "filled_black" : "outline", size: "large", shape: "rectangular", text: "signin_with", width: 280 });
  say("If Google shows an error such as origin_mismatch, add " + location.origin + " to the Google client's authorized JavaScript origins.");
}
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="start()" onerror="start()"></script>
