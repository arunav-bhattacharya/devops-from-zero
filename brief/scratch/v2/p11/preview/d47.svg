<svg viewBox="0 0 560 224" xmlns="http://www.w3.org/2000/svg" role="img" width="1120" height="448" aria-label="A log line goes from hello-devops through the Docker engine to Fluent Bit, then to Elasticsearch, and you search it with Kibana"><style>
.bx{fill:#f3f4f6;stroke:#6b7280}.bxo{fill:#f59e0b;stroke:#b45309}.bxt{fill:#14b8a6;stroke:#0f766e}
.bxg{fill:#eab308;stroke:#a16207}.bxp{fill:#8b5cf6;stroke:#6d28d9}
.ln{stroke:#374151;stroke-width:1.5}.lnd{stroke:#374151;stroke-width:1.5;stroke-dasharray:4 3}
.t{fill:#111827;font-family:sans-serif}.ts{fill:#4b5563;font-family:sans-serif}.tk{fill:#ffffff;font-family:sans-serif;font-weight:bold}
</style><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs><rect class="bxt" x="16" y="24" width="128" height="44" rx="10"/><text class="tk" x="80" y="51" font-size="13" text-anchor="middle">hello-devops</text><line class="ln" x1="146" y1="46" x2="196" y2="46" marker-end="url(#ar)"/><text class="ts" x="171" y="38" font-size="11" text-anchor="middle">stdout</text><rect class="bx" x="200" y="24" width="136" height="44" rx="10"/><text class="t" x="268" y="51" font-size="13" text-anchor="middle">Docker engine</text><line class="ln" x1="338" y1="46" x2="396" y2="46" marker-end="url(#ar)"/><text class="ts" x="367" y="38" font-size="11" text-anchor="middle">forward</text><rect class="bxo" x="400" y="24" width="136" height="44" rx="10"/><text class="tk" x="468" y="51" font-size="13" text-anchor="middle">Fluent Bit</text><text class="ts" x="468" y="86" font-size="11" text-anchor="middle">parse to JSON</text><line class="ln" x1="468" y1="92" x2="468" y2="142" marker-end="url(#ar)"/><text class="ts" x="476" y="122" font-size="11" text-anchor="start">bulk API</text><rect class="bxp" x="400" y="146" width="136" height="44" rx="10"/><text class="tk" x="468" y="173" font-size="13" text-anchor="middle">Elasticsearch</text><text class="ts" x="468" y="208" font-size="11" text-anchor="middle">hello-logs-*</text><rect class="bx" x="16" y="146" width="128" height="44" rx="10"/><text class="t" x="80" y="173" font-size="13" text-anchor="middle">Your browser</text><line class="ln" x1="146" y1="168" x2="196" y2="168" marker-end="url(#ar)"/><text class="ts" x="171" y="160" font-size="11" text-anchor="middle">5601</text><rect class="bxg" x="200" y="146" width="136" height="44" rx="10"/><text class="tk" x="268" y="173" font-size="13" text-anchor="middle">Kibana</text><line class="ln" x1="338" y1="168" x2="396" y2="168" marker-end="url(#ar)"/><text class="ts" x="367" y="160" font-size="11" text-anchor="middle">search</text><text class="ts" x="80" y="86" font-size="11" text-anchor="middle">one line per event</text><text class="ts" x="268" y="86" font-size="11" text-anchor="middle">port 24224</text></svg>