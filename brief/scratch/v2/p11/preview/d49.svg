<svg viewBox="0 0 560 232" xmlns="http://www.w3.org/2000/svg" role="img" width="1120" height="464" aria-label="A trace waterfall: the GET / server span lasts 835 ms and its child INCRBY Redis span lasts 832 ms of that time"><style>
.bx{fill:#f3f4f6;stroke:#6b7280}.bxo{fill:#f59e0b;stroke:#b45309}.bxt{fill:#14b8a6;stroke:#0f766e}
.bxg{fill:#eab308;stroke:#a16207}.bxp{fill:#8b5cf6;stroke:#6d28d9}
.ln{stroke:#374151;stroke-width:1.5}.lnd{stroke:#374151;stroke-width:1.5;stroke-dasharray:4 3}
.t{fill:#111827;font-family:sans-serif}.ts{fill:#4b5563;font-family:sans-serif}.tk{fill:#ffffff;font-family:sans-serif;font-weight:bold}
</style><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#374151"/></marker></defs><text class="ts" x="16" y="22" font-size="11" text-anchor="start">one trace: 0d99b605...</text><text class="t" x="16" y="62" font-size="13" text-anchor="start">GET /</text><text class="ts" x="16" y="78" font-size="11" text-anchor="start">server span</text><rect class="bxo" x="128" y="42" width="400" height="34" rx="10"/><text class="tk" x="328" y="64" font-size="13" text-anchor="middle">835 ms</text><line class="lnd" x1="134" y1="78" x2="134" y2="100"/><text class="t" x="16" y="122" font-size="13" text-anchor="start">INCRBY</text><text class="ts" x="16" y="138" font-size="11" text-anchor="start">client span</text><rect class="bxt" x="130" y="102" width="399" height="34" rx="10"/><text class="tk" x="329.5" y="124" font-size="13" text-anchor="middle">832 ms</text><line class="ln" x1="128" y1="170" x2="528" y2="170"/><text class="ts" x="128" y="188" font-size="11" text-anchor="middle">0 ms</text><text class="ts" x="320" y="188" font-size="11" text-anchor="middle">400 ms</text><text class="ts" x="511" y="188" font-size="11" text-anchor="middle">800 ms</text><line class="ln" x1="128" y1="164" x2="128" y2="176"/><line class="ln" x1="320" y1="164" x2="320" y2="176"/><line class="ln" x1="511" y1="164" x2="511" y2="176"/><text class="ts" x="16" y="216" font-size="11" text-anchor="start">parent and child share the trace ID; the child holds the parent's span ID</text></svg>