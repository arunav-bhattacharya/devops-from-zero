# Deploys the course site to Cloudflare on every push to main, and on demand (Actions tab > deploy > Run workflow).
# Needs two repository secrets (Settings > Secrets and variables > Actions); without both, the run skips the deploy:
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID (shown on the Workers & Pages overview page)
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the Cloudflare settings
        id: cfg
        env:
          TOKEN_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_VAR: ${{ vars.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          token="${TOKEN_SECRET:-$TOKEN_VAR}"; account="${ACCOUNT_SECRET:-$ACCOUNT_VAR}"
          if [ -z "$token" ] && [ -z "$account" ]; then
            # No secrets at all: deploys are handled elsewhere (Cloudflare's own Git integration, or by hand).
            echo "::notice::Skipped: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set. See DEPLOY.md, Option A."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ -n "$token" ] || { echo "::error::CLOUDFLARE_API_TOKEN is missing (Settings > Secrets and variables > Actions > Secrets)."; exit 1; }
          [ -n "$account" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing (Settings > Secrets and variables > Actions > Secrets)."; exit 1; }
          if [ -z "$TOKEN_SECRET" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is a variable, so anyone who can see the repo settings can read it. Move it to the Secrets tab."
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - if: steps.cfg.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy public/ to Cloudflare
        if: steps.cfg.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.0"
          command: deploy
